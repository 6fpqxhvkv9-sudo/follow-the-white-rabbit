<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="East Blue — a white rabbit wandering an endless blue. A game by Cony.">
<meta property="og:title" content="East Blue">
<meta property="og:description" content="A white rabbit wandering an endless blue. A game by Cony.">
<meta name="theme-color" content="#082CFB">
<link rel="icon" href="../favicon.png">
<title>East Blue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Gloock&display=swap">
<style>
/* Layout: one full-bleed chroma-blue canvas; HUD in the corners, tuning drawer bottom-right, touch pads on phones */
:root{
  --blue:#041aee;
  --deep:#0212b8;
  --white:#ffffff;
  --ink:#2a2e5c;
  --dim:rgba(42,46,92,.62);
  --line:rgba(255,255,255,.28);
  --display:"Gloock", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html,body{height:100%}
body{margin:0;background:#082CFB;color:var(--white);overflow:hidden;font-family:var(--mono)}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.hud h1{color:var(--ink);margin:0;font-family:var(--display);font-weight:400;font-size:clamp(20px,3.2vw,30px);line-height:1;letter-spacing:.01em}
.hud .sub{margin-top:7px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.meter{font-size:11px;letter-spacing:.08em;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.meter b{display:block;font-size:22px;font-weight:600;color:var(--ink)}
.state{position:fixed;left:16px;padding:4px 8px;background:rgba(20,28,80,.55);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font-size:11px;letter-spacing:.08em;color:var(--dim);font-variant-numeric:tabular-nums;pointer-events:none}
.tune{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font-size:12px;max-width:calc(100% - 32px)}
.tune summary{cursor:pointer;list-style:none;text-align:right;display:inline-block;float:right;padding:4px 10px!important;background:rgba(20,28,80,.55);color:var(--white)!important;letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:var(--dim);padding:6px 0}
.tune summary::-webkit-details-marker{display:none}
.tune summary:focus-visible{outline:2px solid var(--white);outline-offset:3px}
.tune[open] summary{color:var(--white)}
.tune .panel{display:grid;gap:10px;padding:14px;margin-top:6px;background:var(--deep);border:1px solid var(--line);width:260px;max-width:100%}
.tune label{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:11px;letter-spacing:.04em}
.tune label output{font-variant-numeric:tabular-nums;color:var(--dim)}
.tune input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--white)}
.tune button{justify-self:start;font:inherit;font-size:11px;letter-spacing:.06em;color:var(--white);background:transparent;border:1px solid var(--line);padding:5px 10px;cursor:pointer}
.tune button:focus-visible{outline:2px solid var(--white);outline-offset:2px}
.pads{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 56px);display:none;justify-content:space-between;align-items:flex-end;pointer-events:none}
.pads .grp{display:flex;gap:12px}
.pad{pointer-events:auto;width:68px;height:68px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:rgba(2,18,184,.45);color:#fff;font:600 24px/1 var(--mono);display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:none}
.pad.jump{width:84px;height:84px;font-size:14px;letter-spacing:.06em}
.pad.on{background:rgba(255,255,255,.25)}
@media (hover:none) and (pointer:coarse){.pads{display:none!important}}
body:not(.dev) .hud,body:not(.dev) .state,body:not(.dev) .tune{display:none!important}
#eyes{position:fixed;z-index:10;left:calc(14px + env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));
  width:clamp(96px,11vw,150px);padding:6px;margin:-6px;line-height:0;-webkit-tap-highlight-color:transparent}
#eyes img{width:100%;height:auto;display:block;pointer-events:none;filter:drop-shadow(0 2px 6px rgba(0,0,40,.25));transition:transform .2s}
@media (hover:hover){#eyes:hover img{transform:scale(1.06)}}
#eyes:focus-visible{outline:2px solid #fff;outline-offset:2px}
#fade{position:fixed;inset:0;background:#082CFB;z-index:30;pointer-events:none;transition:opacity .6s ease}
#fade.off{opacity:0}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
img,canvas{-webkit-user-drag:none;-webkit-user-select:none;user-select:none}
</style>
</head>
<body>

<a id="eyes" href="../" aria-label="Back to Follow the White Rabbit"><img src="../img/eyes.webp" alt=""></a>
<div id="fade"></div>
<canvas id="stage" aria-label="East Blue 게임 화면"></canvas>
<div class="hud">
  <div>
    <h1>East Blue</h1>
    <div class="sub"><span class="keys">← → 이동 · SPACE 점프(공중에서 한 번 더) · SHIFT나 두 번 톡 질주 · ↓ 엎드리기 · 휠 줌</span></div>
  </div>
  <div class="meter" hidden>DISTANCE<b id="dist">0000 m</b></div>
</div>
<div class="state" id="state">IDLE</div>
<details class="tune" id="tune">
  <summary>튜닝</summary>
  <div class="panel">
    <label for="tSpeed">이동 속도<output id="oSpeed"></output><input id="tSpeed" type="range" min="200" max="900" step="10"></label>
    <label for="tHop">깡총 템포<output id="oHop"></output><input id="tHop" type="range" min="30" max="84" step="1"></label>
    <label for="tJump">점프 높이<output id="oJump"></output><input id="tJump" type="range" min="0.1" max="0.6" step="0.01"></label>
    <label for="tTurn">방향 전환 속도<output id="oTurn"></output><input id="tTurn" type="range" min="16" max="70" step="1"></label>
    <label for="tPause">깡총 사이 앉는 깊이<output id="oPause"></output><input id="tPause" type="range" min="0" max="0.6" step="0.01"></label>
    <label for="tSprint">질주 속도<output id="oSprint"></output><input id="tSprint" type="range" min="1.4" max="3.2" step="0.1"></label>
    <label for="tSprintFps">질주 다리 템포<output id="oSprintFps"></output><input id="tSprintFps" type="range" min="18" max="44" step="1"></label>
    <button type="button" id="tReset">기본값으로</button>
  </div>
</details>
<div class="pads">
  <div class="grp">
    <button class="pad" id="padL" aria-label="왼쪽으로 이동">←</button>
    <button class="pad" id="padR" aria-label="오른쪽으로 이동">→</button>
    <button class="pad" id="padD" aria-label="엎드리기">↓</button>
  </div>
  <button class="pad jump" id="padJ" aria-label="점프">JUMP</button>
</div>

<script>
// no text selection, magnifier, callout menu or double-tap zoom while playing
['selectstart','dragstart','contextmenu','dblclick','gesturestart'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchstart',e=>{if(!e.target.closest('.tune,#eyes'))e.preventDefault()},{passive:false});
(()=>{
// ================= sprite data =================
const META={"ref": 359, "anims": {"idle": {"frames": 26, "cols": 8, "w": 302, "h": 264, "ax": 151.0, "ay": 258.5}, "look": {"frames": 14, "cols": 8, "w": 302, "h": 278, "ax": 151.0, "ay": 257.0}, "hop": {"frames": 47, "cols": 8, "w": 369, "h": 359, "ax": 184.5, "ay": 334.8}, "sprint": {"frames": 40, "cols": 8, "w": 501, "h": 282, "ax": 250.5, "ay": 270.0}, "scratch": {"frames": 45, "cols": 8, "w": 302, "h": 262, "ax": 151.0, "ay": 257.0}, "lie": {"frames": 43, "cols": 8, "w": 392, "h": 274, "ax": 196.0, "ay": 257.0}, "loaf": {"frames": 35, "cols": 8, "w": 348, "h": 289, "ax": 174.0, "ay": 257.0}}};
const SPRITES=Object.keys(META.anims);
const ZOOM=1/1.3;               // camera distance: 1 = the rabbit at its original size
const HZ=()=>Math.min(H,W*1.1)*ZOOM;   // on a tall phone screen the width sets the rabbit's size
const sheets={};let loadedCount=0;
for(const n of SPRITES){const im=new Image();im.onload=()=>loadedCount++;im.src='sprites/'+n+'.webp';sheets[n]=im}
const CRASH_START=150, CRASH_LEN=60;   // metres: winter night, then the world breaks into the blue screen

// hop clip landmarks (24fps source)
const HOP={prepFrom:5,push:10,air:15,apex:21,fall:24,touch:29,landEnd:31,settleEnd:46};
// how much the body travels on each hop frame, so feet do not slide while planted
const TRAVEL=f=>f<12?0.25:f<15?0.8:f<=27?1.45:f<=31?0.35:0.1;
// look clip (turn frames): 0-3 side, 4-12 swinging to face the camera
const TURN_SEQ=[3,5,7,8,9,10,11,12], TURN_SEQ_FAST=[4,7,9,11,12];
// sprint clip: 0-15 sit -> first bound, 16-39 bounding loop
const SPR={loop:16,len:24,compact:new Set([16,17,39])};
// scratch clip: 0-28 foot up scratching, 29-44 back to sitting; lie clip: 0-15 down, 16-26 resting, 27-42 up
const SCR={back:29,end:44}, LIE_FLAT={rest:16,restLen:11,up:27,end:42}, LOAF={rest:11,restLen:11,up:22,end:34};


// ================= tuning =================
const DEFAULTS={day:180,speed:540,hopFps:58,jump:0.3,turnFps:34,pause:0.15,sprint:1.5,sprintFps:30};
let TUNE={...DEFAULTS};
try{Object.assign(TUNE,JSON.parse(localStorage.getItem('rabbit-tune-v2')||'{}'))}catch(e){}
const bindings=[['tSpeed','oSpeed','speed',v=>v+' px/s'],['tHop','oHop','hopFps',v=>(v/22).toFixed(1)+' 깡총/s'],
  ['tJump','oJump','jump',v=>Math.round(v*100)+'%'],['tTurn','oTurn','turnFps',v=>(8/v).toFixed(2)+' s'],['tPause','oPause','pause',v=>Math.round(v/0.6*100)+'%'],['tSprint','oSprint','sprint',v=>'×'+v.toFixed(1)],['tSprintFps','oSprintFps','sprintFps',v=>v+' fps']];
function syncTune(){for(const[i,o,k,f]of bindings){const el=document.getElementById(i);el.value=TUNE[k];document.getElementById(o).textContent=f(+TUNE[k])}}
for(const[i,o,k,f]of bindings){document.getElementById(i).addEventListener('input',e=>{TUNE[k]=+e.target.value;syncTune();
  try{localStorage.setItem('rabbit-tune-v2',JSON.stringify(TUNE))}catch(err){}})}
document.getElementById('tReset').addEventListener('click',()=>{TUNE={...DEFAULTS};syncTune();try{localStorage.removeItem('rabbit-tune-v2')}catch(e){}});
syncTune();


// ================= canvas =================
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

// ================= input =================
addEventListener('keydown',e=>{if(e.key==='t'||e.key==='T')document.body.classList.toggle('dev')});
const keys={l:false,r:false,j:false,s:false,dn:false};let downPressed=false,jumpPressed=false,fastLatch=false;const lastTap={l:0,r:0};
const K={ArrowDown:'dn',s:'dn',S:'dn',Shift:'s',ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',' ':'j',ArrowUp:'j',w:'j',W:'j'};
addEventListener('keydown',e=>{const k=K[e.key];if(!k)return;if(e.target.closest&&e.target.closest('.tune'))return;e.preventDefault();
  if(k==='j'&&!keys.j)jumpPressed=true;
  if(k==='dn'&&!keys.dn)downPressed=true;
  if((k==='l'||k==='r')&&!keys[k]&&!e.repeat){const now=performance.now();if(now-lastTap[k]<300)fastLatch=true;lastTap[k]=now}
  keys[k]=true});
addEventListener('keyup',e=>{const k=K[e.key];if(k)keys[k]=false;if(!keys.l&&!keys.r)fastLatch=false});
addEventListener('blur',()=>{keys.l=keys.r=keys.j=keys.s=false;fastLatch=false});
function bindPad(id,k){const el=document.getElementById(id);
  const on=e=>{e.preventDefault();if(k==='j'&&!keys.j)jumpPressed=true;if(k==='dn'&&!keys.dn)downPressed=true;
    if(k==='l'||k==='r'){const now=performance.now();if(now-lastTap[k]<320)fastLatch=true;lastTap[k]=now}
    keys[k]=true;el.classList.add('on')};
  const off=()=>{keys[k]=false;el.classList.remove('on');if(!keys.l&&!keys.r)fastLatch=false};
  el.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,off))}
bindPad('padL','l');bindPad('padR','r');bindPad('padD','dn');bindPad('padJ','j');
// touch: hold left/right half to walk, swipe up = jump, swipe down = lie down,
// double-tap and hold = sprint, a second finger tap while walking = jump
const touches=new Map();let lastTouch={side:0,t:0};
let VZ=1,AZ=1,pinch=null;const clampZ=z=>Math.min(4,Math.max(1,z));
function touchDist(){const p=[...touches.values()];return Math.hypot(p[0].cx-p[1].cx,p[0].cy-p[1].cy)||1}
cv.addEventListener('wheel',e=>{e.preventDefault();VZ=clampZ(VZ*Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0015)))},{passive:false});
function touchDir(){let l=false,r=false;for(const t of touches.values()){if(t.walk){if(t.side<0)l=true;else r=true}}keys.l=l;keys.r=r;if(!l&&!r)fastLatch=false}
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;e.preventDefault();
  const side=e.clientX<innerWidth/2?-1:1,now=performance.now();
  const walking=[...touches.values()].some(t=>t.walk);
  const t={x:e.clientX,y:e.clientY,cx:e.clientX,cy:e.clientY,t:now,side,walk:!walking,swiped:false};
  if(walking){t.tapJump=true}
  if(!walking&&lastTouch.side===side&&now-lastTouch.t<300)fastLatch=true;
  lastTouch={side,t:now};touches.set(e.pointerId,t);
  if(touches.size===2){for(const u of touches.values()){u.walk=false;u.tapJump=false;u.pinch=true}pinch={d0:touchDist(),z0:VZ};fastLatch=false}
  touchDir();
  try{cv.setPointerCapture(e.pointerId)}catch(err){}});
cv.addEventListener('pointermove',e=>{const t=touches.get(e.pointerId);if(!t)return;t.cx=e.clientX;t.cy=e.clientY;
  if(pinch&&touches.size===2){VZ=clampZ(pinch.z0*touchDist()/pinch.d0);return}
  if(t.swiped||t.pinch)return;
  const dy=e.clientY-t.y,dx=e.clientX-t.x;
  if(Math.abs(dy)>40&&Math.abs(dy)>Math.abs(dx)*1.2){t.swiped=true;
    if(dy<0)jumpPressed=true;else{downPressed=true;t.walk=false;touchDir()}}});
function endTouch(e){const t=touches.get(e.pointerId);if(!t)return;
  if(t.tapJump&&!t.swiped&&!t.pinch&&performance.now()-t.t<250)jumpPressed=true;
  touches.delete(e.pointerId);if(touches.size<2)pinch=null;touchDir()}
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,endTouch));

// ================= rabbit =================
// states: idle, look, start, hop, settle, turn, prep, air, land
const R={lieKind:'lie',wantLie:false,nextScratch:7,sf:0,fastAir:false,exiting:false,exitFrom:0,lp:'down',trail:[],doubled:false,dj:9,x:0,y:0,vx:0,vy:0,face:1,state:'idle',t:0,sheet:'idle',frame:0,still:0,
  turnTo:0,turnFast:false,flipped:false,afterTurn:null,squash:0,squashT:1,lean:0};
function go(state){R.state=state;R.t=0}
function kick(a){R.squash=a;R.squashT=0}
const particles=[];
const prints=[];
function dust(){}
// feet touching the snow, measured from the sprites: per frame [x from body centre (sprite px), width]
const CONTACT={"hop": [[[-40.5, 87], [63.5, 35]], [[-40.5, 87], [63.0, 36]], [[-40.5, 87], [63.0, 36]], [[-40.5, 87], [62.5, 37]], [[-41.0, 86], [62.0, 36]], [[-42.5, 87], [61.0, 36]], [[-44.0, 86], [59.5, 35]], [[-48.5, 83], [55.5, 31]], [[-50.5, 79], [53.5, 27]], [[-52.0, 74], [52.5, 21]], [[-54.5, 69], [53.5, 9]], [[-61.0, 54]], [[-62.5, 43]], [[-67.5, 37]], [[-74.5, 35]], [[-90.5, 25]], [[-100.0, 24]], [[-110.0, 22]], [[-118.0, 14]], [], [], [], [], [], [], [], [], [[78.0, 34]], [[74.0, 36]], [[70.0, 38]], [[67.0, 40]], [[61.0, 40]], [[58.0, 40]], [[56.5, 41]], [[-27.0, 12], [55.0, 40]], [[-21.0, 30], [54.0, 40]], [[-20.0, 32], [54.0, 40]], [[-20.5, 35], [54.5, 39]], [[-21.5, 37], [54.0, 38]], [[-23.0, 40], [55.5, 37]], [[-22.5, 41], [56.0, 36]], [[-22.0, 42], [57.0, 36]], [[-61.5, 13], [-22.5, 43], [58.0, 36]], [[-41.5, 83], [59.0, 36]], [[-42.0, 84], [59.0, 36]], [[-42.0, 86], [60.5, 37]], [[-43.0, 86], [60.5, 35]]], "sprint": [[[-41.0, 84], [62.0, 34]], [[-41.5, 83], [61.0, 34]], [[-65.5, 21], [-22.5, 43], [59.5, 33]], [[-22.0, 40], [58.0, 34]], [[-20.5, 31], [58.0, 30]], [[-32.0, 26], [58.5, 27]], [[-73.0, 24], [46.0, 16]], [[-122.5, 21]], [], [], [], [], [[150.0, 36]], [[137.5, 31]], [[94.0, 38]], [[-42.0, 10], [56.0, 38]], [[-34.5, 31], [46.5, 31]], [[-43.5, 27], [37.0, 26]], [[-90.0, 26], [19.5, 13]], [[-152.5, 17], [27.5, 3]], [], [], [], [[146.5, 35]], [[139.5, 31]], [[105.5, 31]], [[-26.5, 27], [59.5, 35]], [[-36.0, 36], [51.5, 29]], [[-71.5, 29], [36.0, 20]], [[-101.5, 21], [23.0, 10]], [[-170.0, 6]], [], [], [], [[148.5, 29]], [[144.5, 35]], [[109.5, 41]], [[79.0, 36]], [[-28.5, 23], [55.0, 38]], [[-17.0, 26], [53.0, 36]]]};
function stampFeet(){
  if(R.y<0||!CONTACT[R.sheet])return;
  const feet=CONTACT[R.sheet][R.frame]||[];
  const key=R.sheet+R.frame;if(key===stampFeet.last)return;stampFeet.last=key;
  const prev=stampFeet.prev||0;stampFeet.prev=feet.length;
  if(!feet.length||feet.length<=prev&&prev>0)return;   // only the moment a foot comes down
  const s=(HZ()*0.34)/META.ref;
  for(const [cx,w] of feet){
    const x=R.x+R.face*cx*s;
    let near=false;for(let k=prints.length-1;k>=Math.max(0,prints.length-12);k--)if(Math.abs(prints[k].x-x)<28*s+6){near=true;break}
    if(near)continue;
    prints.push({x,w:Math.min(w,40)*s,front:cx>0,t:0,seed:Math.random()});
    if(prints.length>160)prints.shift();
  }
}

function input(){return (keys.r?1:0)-(keys.l?1:0)}
const isFast=()=>keys.s||fastLatch;
const onGround=()=>R.y>=-groundH(R.x)-0.5&&!['prep','air'].includes(R.state);

function beginTurn(dir,fast){R.turnTo=dir;R.turnFast=fast;R.flipped=false;go('turn')}
function beginJump(){R.fastAir=isFast()&&R.state==='sprint';go('prep');kick(1);R.doubled=false;R.dj=9}
function enterSprint(fromSit){R.sf=fromSit?4:SPR.loop;go('sprint');if(!fromSit)kick(1)}

function update(dt){
  let dir=input();
  { const m=HZ()*0.25,ww=worldW();          // pushing against the edge of the painting: stop and settle
    if(isFinite(ww)&&((dir<0&&R.x<=m+1&&R.face<0)||(dir>0&&R.x>=ww-m-1&&R.face>0)))dir=0; }
  const sp=TUNE.speed*ZOOM;
  let targetVx=0;
  R.t+=dt;

  // jump can start from any grounded state except mid-turn
  const jp=jumpPressed;jumpPressed=false;
  if(downPressed){downPressed=false;R.wantLie=true}
  if(dir!==0||jp)R.wantLie=false;
  if(jp&&onGround()&&!['turn','prep','lie','scratch'].includes(R.state)){beginJump()}
  if(R.wantLie&&R.state==='scratch'&&!R.exiting){R.exiting=true;R.exitFrom=Math.max(SCR.back,R.frame);R.t=0}
  // sprint: hold Shift or double-tap a direction
  if(isFast()&&dir!==0&&dir===R.face){
    const st=R.state;
    if(['idle','start','pause','settle'].includes(st))enterSprint(true);
    else if(st==='land'||(st==='hop'&&(R.frame>=HOP.touch||R.frame<HOP.air-1)))enterSprint(false);
  }

  switch(R.state){
    case 'idle':{
      R.sheet='idle';R.frame=Math.floor(R.t*12)%META.anims.idle.frames;
      R.still+=dt;
      if(dir!==0){R.still=0;R.nextScratch=7;if(dir!==R.face)beginTurn(dir,false);else go('start');break}
      if(R.wantLie){R.wantLie=false;R.lieKind='loaf';R.lp='down';go('lie');break}  // ↓: lie down, ears up
      if(R.still>18){R.lieKind='lie';R.lp='down';go('lie');break}                   // long wait: lie down flat, ears back
      if(R.still>R.nextScratch){R.exiting=false;go('scratch');R.nextScratch=R.still+8+Math.random()*4}
      break}
    case 'scratch':{ // hind foot scratches the ear; any input hurries it back to sitting
      R.sheet='scratch';
      if((dir!==0||jp)&&!R.exiting){R.exiting=true;R.exitFrom=Math.max(SCR.back,R.frame);R.t=0}
      R.frame=R.exiting?Math.min(SCR.end,R.exitFrom+Math.floor(R.t*30)):Math.min(SCR.end,Math.floor(R.t*12));
      R.still+=dt;
      if(R.frame>=SCR.end){const d=input();
        if(d!==0){R.still=0;R.nextScratch=7;if(d!==R.face)beginTurn(d,false);else go('start')}
        else go('idle')}

    case 'lie':{ // lie down, rest (breathing loop), get up when anything is pressed

      if(R.lp==='down'){R.frame=Math.min(LIE.rest-1,Math.floor(R.t*12));

      if(R.lp==='rest'){const n=LIE.restLen,k=Math.floor(R.t*5)%(n*2-2);R.frame=LIE.rest+(k<n?k:n*2-2-k);
        if(dir!==0||jp){R.lp='up';R.t=0}}
      if(R.lp==='up'){R.frame=Math.min(LIE.end,LIE.up+Math.floor(R.t*18));
        if(R.frame>=LIE.end){R.still=0;R.nextScratch=7;const d=input();
          if(d!==0){if(d!==R.face)beginTurn(d,false);else go('start')}else go('idle')}}
      break}
    case 'sprint':{ // bounding gallop; lets go back to hopping on a compact frame
      R.sheet='sprint';

      const k=Math.floor(R.sf);R.frame=k<SPR.loop?k:SPR.loop+((k-SPR.loop)%SPR.len);
      const ramp=Math.min(1,R.sf/SPR.loop);
      targetVx=R.face*sp*TUNE.sprint*(0.35+0.65*ramp);
      if(dir===0||dir!==R.face){go('land');kick(-1);dust(8,80,50);break}
      if(!isFast()&&k>=SPR.loop&&SPR.compact.has(R.frame)){go('hop');kick(1)}
      break}
    case 'look':{
      R.sheet='look';const f=Math.floor(R.t*12);R.frame=Math.min(f,47);
      if(dir!==0){ // interrupted: if facing camera, finish the turn toward the pressed side
        if(f>=4&&f<=40){R.face=dir;R.turnTo=dir;R.flipped=true;R.turnFast=true;go('turn');R.t=TURN_SEQ_FAST.length/TUNE.turnFps/1.6;break}
        if(dir!==R.face)beginTurn(dir,false);else go('start');break}
      if(f>=47){go('idle');R.still=-4}
      break}
    case 'start':{ // anticipation: crouch before the first push
      R.sheet='hop';const f=HOP.prepFrom+Math.floor(R.t*TUNE.hopFps*1.3);R.frame=Math.min(f,HOP.push);
      targetVx=0;
      if(dir===0){go('idle');break}
      if(dir!==R.face){beginTurn(dir,false);break}
      if(f>=HOP.push){go('hop');R.t=0;kick(1);dust(4,40,40)}
      break}
    case 'hop':{ // one hop: push -> air -> touch-down; then a short rest beat before the next one
      R.sheet='hop';
      const f=Math.min(HOP.push+Math.floor(R.t*TUNE.hopFps),HOP.landEnd);R.frame=f;
      targetVx=R.face*sp*TRAVEL(f);
      const grounded=f>=HOP.touch||f<HOP.air-1;
      if(dir!==0&&dir!==R.face&&grounded){beginTurn(dir,true);break}
      if(f===HOP.touch&&!R._touched){dust(3,40,20);R._touched=true;kick(-0.5)}
      if(f!==HOP.touch)R._touched=false;
      if(f>=HOP.landEnd){
        if(dir===0){go('settle');kick(-1);dust(5,50,30)}
        else{R.settleTo=Math.min(HOP.settleEnd,HOP.landEnd+1+Math.round(TUNE.pause/0.6*12)+Math.floor(Math.random()*3)-1);go('pause');kick(-0.6)}
      }
      break}
    case 'pause':{ // same as tapping the key: sink back toward sitting, then crouch and push again
      R.sheet='hop';const f=HOP.landEnd+1+Math.floor(R.t*36);R.frame=Math.min(f,R.settleTo);
      targetVx=0;
      if(dir===0){go('settle');R.t=(R.frame-HOP.landEnd-1)/28;break}
      if(dir!==R.face){beginTurn(dir,false);break}
      if(f>=R.settleTo){go('start')}

    case 'settle':{ // landing crouch back into sitting

      if(dir!==0){if(dir!==R.face)beginTurn(dir,false);else{go('hop');R.t=0;kick(1)}break}

        else if(d!==0){beginTurn(d,R.turnFast)}

      R.sheet='hop';const f=8+Math.floor(R.t*50);R.frame=Math.min(f,HOP.air-1);

      break}
    case 'air':{
      R.sheet='hop';
      const g=HZ()*3.2;
      if(jp&&!R.doubled){ // second jump: tuck, push off thin air, pixel ring + afterimages
        R.doubled=true;R.dj=0;R.vy=-Math.sqrt(2*g*HZ()*TUNE.jump*0.85);kick(1);

      R.y+=R.vy*dt;
      const vmax=Math.sqrt(2*g*HZ()*TUNE.jump)||1,k=R.vy/vmax; // -1 rising fast .. +1 falling fast

    case 'land':{
      R.sheet='hop';const f=HOP.touch+Math.floor(R.t*26);R.frame=Math.min(f,HOP.landEnd);

  }

  const accel=R.state==='air'?4:(R.state==='turn'?10:12);

  if(Math.abs(R.vx)<1)R.vx=0;
  R.x+=R.vx*dt;
  { const m=HZ()*0.25,ww=worldW();
    if(isFinite(ww)){if(R.x<m){R.x=m;if(R.vx<0)R.vx=0}
    if(R.x>ww-m){R.x=ww-m;if(R.vx>0)R.vx=0}} }
  if(R.state!=='air'&&R.state!=='prep'){
    const gh=groundH(R.x),drop=(-R.y)-gh;

    }else R.y=-gh;
  }
  R.squashT=Math.min(1,R.squashT+dt/0.24);
  if(R.state!=='turn')R.lean=0;
}

function drawBSOD(G,time){
  ctx.fillStyle='#041aee';ctx.fillRect(0,-H,W,H*2);

  ctx.textBaseline='alphabetic';
  const farSlot=520,farOff=cam*0.15,ff=Math.floor(farOff/farSlot)-1;
  for(let i=ff;i<ff+W/farSlot+3;i++){
    const x=i*farSlot-farOff,y=H*(0.16+hash(i)*0.34);
    ctx.fillStyle='rgba(255,255,255,0.055)';

  // floor perspective lines
  ctx.strokeStyle='rgba(255,255,255,0.10)';ctx.lineWidth=1;
  const vp=W/2,step=120,fOff=cam%step;
  ctx.beginPath();
  for(let x=-W;x<W*2;x+=step){const bx=x-fOff;ctx.moveTo(bx,G);ctx.lineTo(vp+(bx-vp)*3.2,H)}
  for(let k=1;k<5;k++){const y=G+(H-G)*(k*k)/25;ctx.moveTo(0,y);ctx.lineTo(W,y)}
  ctx.stroke();
  // ground ticks every metre, labels every 5 m (60 px = 1 m)
  const M=60,tOff=cam,tf=Math.floor((tOff-W/2)/M)-1;
  ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font=`11px ${mono}`;ctx.textAlign='center';
  for(let i=tf;i<tf+W/M+3;i++){const x=i*M-tOff+W/2;const big=i%5===0;ctx.fillRect(x,G+2,1,big?10:5);
    if(big&&i>=0)ctx.fillText(i+' m',x,G+26)}

}

  if(!ok(im))return;const sc=h/im.naturalHeight,w=im.naturalWidth*sc,off=cam*par,first=Math.floor(off/w)-1;

// A mound row at depth z (1 = the rabbit's path; >1 further back, <1 closer to us).
// Further rows sit higher, look smaller and slide slower.
// Height profile of each mound painting (0..1 of its height, per column), read once the image loads.
const PROF={};
function profile(name){
  if(PROF[name])return PROF[name];const im=IMG[name],m=MOUNDS[name];if(!ok(im))return null;
  const c=document.createElement('canvas');c.width=m.w;c.height=m.base;const x=c.getContext('2d');x.drawImage(im,0,0);
  let d;try{d=x.getImageData(0,0,m.w,m.base).data}catch(e){return null}
  const N=200,p=new Float32Array(N);
  for(let k=0;k<N;k++){const u=Math.floor(k/(N-1)*(m.w-1));let top=m.base;
    for(let y=0;y<m.base;y++)if(d[(y*m.w+u)*4+3]>140){top=y;break}
    p[k]=Math.max(0,(m.base-top)/m.base)}

// mounds on the path, in world coordinates (same speed as the rabbit)

function pathMound(i){

  const name=MNAMES[Math.floor(hash(i*5.3+PATH_SEED)*MNAMES.length)],m=MOUNDS[name];
  const hh=HZ()*(0.22+0.3*hash(i*7.1+PATH_SEED));          // about 0.6x to 1.5x the rabbit's height
  const sc=hh/m.base,stretch=1.7;                           // stretched wide so slopes stay walkable

  for(let i=i0-1;i<=i0+1;i++){const pm=pathMound(i);if(!pm||x<pm.x0||x>pm.x0+pm.w)continue;
    const p=profile(pm.name);if(!p)continue;let u=(x-pm.x0)/pm.w;if(pm.flip)u=1-u;

function moundRow(z,G,seed,chance,sizeMin,sizeMax){

function drawParticles(G,dt){
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.t+=dt;if(p.t>p.life){particles.splice(i,1);continue}

    ctx.fillRect(W/2+(p.x-cam)-p.s/2,G+p.y-p.s,p.s,p.s)}
