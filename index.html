<style>
  :root { --blue:#082CFB; --ink:#fff; --bar:#e9e9ec; --barink:#222; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --blue:#082CFB; --ink:#fff; --bar:#e9e9ec; --barink:#222; } }
  :root[data-theme="dark"] { --blue:#082CFB; --ink:#fff; --bar:#e9e9ec; --barink:#222; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--blue); overscroll-behavior:none; }
  body { -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; font-family:'Inter', system-ui, sans-serif; }
  #map { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; display:block; touch-action:none; cursor:grab; }
  #map.drag { cursor:grabbing; }
  #map [data-act] { cursor:pointer; transition:opacity .15s; }
  @media (hover:hover) { #map [data-act]:hover { opacity:.75; } }
  #map tspan[data-act] { text-decoration:underline; text-underline-offset:6px; }
  #map [data-act]:focus { outline:none; }
  #map text[data-act] { pointer-events:bounding-box; }
  #map [data-act]:focus-visible { opacity:.6; }
  #map text { font-family:'Inter', 'Noto Sans KR', system-ui, sans-serif; }

  /* the eyes: always top-left */
  #eyes { position:fixed; z-index:10; left:calc(14px + env(safe-area-inset-left,0px)); top:calc(14px + env(safe-area-inset-top,0px));
          width:clamp(96px, 11vw, 150px); padding:6px; margin:-6px; border:0; background:none; cursor:pointer; line-height:0; }
  #eyes img { width:100%; height:auto; display:block; pointer-events:none; filter:drop-shadow(0 2px 6px rgba(0,0,40,.25)); transition:transform .2s; }
  @media (hover:hover) { #eyes:hover img { transform:scale(1.06); } }
  #eyes:focus-visible { outline:2px solid #fff; outline-offset:2px; }

  /* video window */
  #player { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; padding:16px; background:rgba(0,10,80,.35); }
  #player.on { display:flex; }
  .win { width:min(960px, 100%); background:#000; border-radius:10px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,40,.45); }
  .bar { display:flex; align-items:center; gap:8px; height:34px; padding:0 12px; background:var(--bar); color:var(--barink); font-size:13px; }
  .dot { width:13px; height:13px; border-radius:50%; border:0; padding:0; flex:none; }
  .dot.r { background:#ff5f57; cursor:pointer; } .dot.y { background:#febc2e; } .dot.g { background:#28c840; }
  .bar .ttl { flex:1; min-width:0; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar a { color:var(--barink); text-decoration:none; opacity:.7; font-size:12px; white-space:nowrap; }
  .bar a:hover { opacity:1; }
  .screen { position:relative; aspect-ratio:16/9; background:#000; }
  .screen iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .screen img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#fff; cursor:pointer; -webkit-user-drag:none; }
  #player.pdf .win { width:min(1280px, 100%); }
  /* a paper (portrait pages): tall window that fits the screen height */
  #player.portrait .win { width:min(100%, calc((100dvh - 120px) * 0.773)); }
  #player.portrait .screen { aspect-ratio:1445/1870; }
  /* no long-press image menu / loupe on the map (iOS) */
  #map, #map * { -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  html, body { touch-action:none; }
  .nav { display:none; align-items:center; justify-content:center; gap:18px; height:40px; background:var(--bar); color:var(--barink); font-size:14px; }
  .nav.on { display:flex; }
  .nav button { border:0; background:none; font:inherit; font-size:20px; color:var(--barink); cursor:pointer; padding:4px 12px; }
  .nav button:disabled { opacity:.25; cursor:default; }
  /* language switch: top-right, mirrors the eyes */
  #lang { position:fixed; z-index:10; right:calc(14px + env(safe-area-inset-right,0px)); top:calc(18px + env(safe-area-inset-top,0px));
          border:0; background:none; color:rgba(255,255,255,.6); font:400 14px/1 'Inter', sans-serif; letter-spacing:.04em; padding:8px 6px; margin:-8px -6px; cursor:pointer; }
  #lang .on { color:#fff; text-decoration:underline; text-underline-offset:4px; }
  #lang:focus-visible { outline:2px solid #fff; outline-offset:2px; }

<text id="daydreaming 한낮에 꾸는 꿈. 눈은 뜨고 있지만 마음은 조금 다른 곳에 가 있다. 원하는 것, 즐거운 상상, 아직 오지 않은 장면들 쪽으로.  블루 안의 얼굴들은 겹쳐지고, 고개를 돌리고, 서로에게 기댄다. 하나의 얼굴이 셋으로 번지고, 시선은 어디에도 초점을 맞추지 않는다. 몽롱하지만 멈추지는 않는다." fill="white" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="30" font-weight="300" letter-spacing="0em"><tspan x="7108" y="7850.91">daydreaming&#10;</tspan><tspan x="7108" y="7888.91">&#xd55c;&#xb0ae;&#xc5d0; &#xafb8;&#xb294; &#xafc8;. &#xb208;&#xc740; &#xb728;&#xace0; &#xc788;&#xc9c0;&#xb9cc; &#xb9c8;&#xc74c;&#xc740; &#xc870;</tspan><tspan x="7108" y="7926.91">&#xae08; &#xb2e4;&#xb978; &#xacf3;&#xc5d0; &#xac00; &#xc788;&#xb2e4;. &#xc6d0;&#xd558;&#xb294; &#xac83;, &#xc990;&#xac70;&#xc6b4; &#xc0c1;</tspan><tspan x="7108" y="7964.91">&#xc0c1;, &#xc544;&#xc9c1; &#xc624;&#xc9c0; &#xc54a;&#xc740; &#xc7a5;&#xba74;&#xb4e4; &#xcabd;&#xc73c;&#xb85c;.&#x2028;</tspan><tspan x="7108" y="8002.91"> &#xbe14;&#xb8e8; &#xc548;&#xc758; &#xc5bc;&#xad74;&#xb4e4;&#xc740; &#xacb9;&#xccd0;&#xc9c0;&#xace0;, &#xace0;&#xac1c;&#xb97c; &#xb3cc;&#xb9ac;</tspan><tspan x="7108" y="8040.91">&#xace0;, &#xc11c;&#xb85c;&#xc5d0;&#xac8c; &#xae30;&#xb304;&#xb2e4;. &#xd558;&#xb098;&#xc758; &#xc5bc;&#xad74;&#xc774; &#xc14b;&#xc73c;&#xb85c; </tspan><tspan x="7108" y="8078.91">&#xbc88;&#xc9c0;&#xace0;, &#xc2dc;&#xc120;&#xc740; &#xc5b4;&#xb514;&#xc5d0;&#xb3c4; &#xcd08;&#xc810;&#xc744; &#xb9de;&#xcd94;&#xc9c0; &#xc54a;</tspan><tspan x="7108" y="8116.91">&#xb294;&#xb2e4;. &#xbabd;&#xb871;&#xd558;&#xc9c0;&#xb9cc; &#xba48;&#xcd94;&#xc9c0;&#xb294; &#xc54a;&#xb294;&#xb2e4;.</tspan></text>

<text id="Idle_Parinirvana_2&#x27;31&quot;_Multi-channel video_Loop_2026 Music: Claude Debussy, Rêverie (1890)" fill="white" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="30" font-weight="300" letter-spacing="0em"><tspan x="8906" y="6516.91">Idle_Parinirvana_2&#39;31&#34;_Multi-channel video_Loop_2026&#10;</tspan><tspan x="8906" y="6562.91">Music: Claude Debussy, R&#xea;verie (1890)</tspan></text>
<rect id="-&gt;idle youtube_2" x="8704" y="8628" width="1194" height="336" fill="url(#pattern49_4002_637)"/>
<text id="Idle 모두가 같은 자세로 눕는다. 라텍스를 입은 사람, 선글라스를 쓴 사람, 명품 옷을 걸친 사람, 웃는 거인, 호랑이, 강아지까지. 오른쪽으로 누워 한 손으로 머리를 괸다.  서양 회화에서 이 자세는 욕망을 받아내는 오달리스크이고, 동양에서는 모든 욕망을 내려놓은 와불이다. 가장 욕망받는 몸들이 가장 욕망 없는 자세로 누워 있다.  몸은 멈춰 있고 눈동자만 천천히 움직인다. 잠든 것도, 떠난 것도 아니다. 기계로 치면 아이들(Idle), 켜져 있지만 아무것도 실행하지 않는 상태다. 블루스크린이 오기 직전, 모든 것은 이렇게 고요해진다." fill="white" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="30" font-weight="300" letter-spacing="0em"><tspan x="8953" y="7859.41">Idle&#10;</tspan><tspan x="8953" y="7898.41">&#xbaa8;&#xb450;&#xac00; &#xac19;&#xc740; &#xc790;&#xc138;&#xb85c; &#xb215;&#xb294;&#xb2e4;. &#xb77c;&#xd14d;&#xc2a4;&#xb97c; &#xc785;&#xc740; &#xc0ac;&#xb78c;, &#xc120;&#xae00;&#xb77c;</tspan><tspan x="8953" y="7937.41">&#xc2a4;&#xb97c; &#xc4f4; &#xc0ac;&#xb78c;, &#xba85;&#xd488; &#xc637;&#xc744; &#xac78;&#xce5c; &#xc0ac;&#xb78c;, &#xc6c3;&#xb294; &#xac70;&#xc778;, &#xd638;&#xb791;&#xc774;, </tspan><tspan x="8953" y="7976.41">&#xac15;&#xc544;&#xc9c0;&#xae4c;&#xc9c0;. &#xc624;&#xb978;&#xcabd;&#xc73c;&#xb85c; &#xb204;&#xc6cc; &#xd55c; &#xc190;&#xc73c;&#xb85c; &#xba38;&#xb9ac;&#xb97c; &#xad38;&#xb2e4;.&#x2028;</tspan><tspan x="8953" y="8015.41"> &#xc11c;&#xc591; &#xd68c;&#xd654;&#xc5d0;&#xc11c; &#xc774; &#xc790;&#xc138;&#xb294; &#xc695;&#xb9dd;&#xc744; &#xbc1b;&#xc544;&#xb0b4;&#xb294; &#xc624;&#xb2ec;&#xb9ac;&#xc2a4;&#xd06c;&#xc774;</tspan><tspan x="8953" y="8054.41">&#xace0;, &#xb3d9;&#xc591;&#xc5d0;&#xc11c;&#xb294; &#xbaa8;&#xb4e0; &#xc695;&#xb9dd;&#xc744; &#xb0b4;&#xb824;&#xb193;&#xc740; &#xc640;&#xbd88;&#xc774;&#xb2e4;. &#xac00;&#xc7a5; &#xc695;</tspan><tspan x="8953" y="8093.41">&#xb9dd;&#xbc1b;&#xb294; &#xbab8;&#xb4e4;&#xc774; &#xac00;&#xc7a5; &#xc695;&#xb9dd; &#xc5c6;&#xb294; &#xc790;&#xc138;&#xb85c; &#xb204;&#xc6cc; &#xc788;&#xb2e4;.&#x2028;</tspan><tspan x="8953" y="8132.41"> &#xbab8;&#xc740; &#xba48;&#xcdb0; &#xc788;&#xace0; &#xb208;&#xb3d9;&#xc790;&#xb9cc; &#xcc9c;&#xcc9c;&#xd788; &#xc6c0;&#xc9c1;&#xc778;&#xb2e4;. &#xc7a0;&#xb4e0; &#xac83;&#xb3c4;, </tspan><tspan x="8953" y="8171.41">&#xb5a0;&#xb09c; &#xac83;&#xb3c4; &#xc544;&#xb2c8;&#xb2e4;. &#xae30;&#xacc4;&#xb85c; &#xce58;&#xba74; &#xc544;&#xc774;&#xb4e4;(Idle), &#xcf1c;&#xc838; &#xc788;&#xc9c0;</tspan><tspan x="8953" y="8210.41">&#xb9cc; &#xc544;&#xbb34;&#xac83;&#xb3c4; &#xc2e4;&#xd589;&#xd558;&#xc9c0; &#xc54a;&#xb294; &#xc0c1;&#xd0dc;&#xb2e4;. &#xbe14;&#xb8e8;&#xc2a4;&#xd06c;&#xb9b0;&#xc774; &#xc624;&#xae30; </tspan><tspan x="8953" y="8249.41">&#xc9c1;&#xc804;, &#xbaa8;&#xb4e0; &#xac83;&#xc740; &#xc774;&#xb807;&#xac8c; &#xace0;&#xc694;&#xd574;&#xc9c4;&#xb2e4;.</tspan></text>

<script>
(() => {
  const svg = document.getElementById('map');
  const [ , , W, H] = svg.getAttribute('viewBox').split(' ').map(Number);   // world size in design units
  const OLD = 'https://6fpqxhvkv9-sudo.github.io/follow-the-white-rabbit/';
  const CHANNEL = 'https://www.youtube.com/@conyca';
  const INSTA = 'https://www.instagram.com/conylog/';

  // ---------- videos (from the "youtube link" boards in Figma) ----------
  const V = {
    hum:         { t:'...hum',                                   ids:['yCPTT2HWdvk'] },
    pig:         { t:'Pig',                                      ids:['IrTLmfbwePg'] },
    idle:        { t:'Idle_Parinirvana',                         ids:['blA9iTVe8TI'] },
    soak:        { t:'Fred again.. & SOAK — just stand there',   ids:['IOCjpTBeIjA'] },
    softmax:     { t:'softmax',                                  ids:['iNObYr0SnUw'] },
    aiexe:       { t:"AI.exe: Dante's Fall",                     ids:['sqpTtHn77H0'] },
    daydreaming: { t:'Daydreaming',                              ids:['w6UZ7NvDK2I'] },
    fishing:     { t:'Fishing',                                  ids:['yxRHQTA8Gwg'] },
    c2024: { t:'Conix · 2024 Immersive Media Art Exhibition', ids:['6OpkB-lz9hk','nzmCq_-Nxlk','kCH97zbiE1c','S-TfLBCw6uo'] },
    c2023: { t:'Conix · 2023 Eterno Cheongdam',                ids:['isNzzi5xa_I'] },
    c2022: { t:'Conix · 2022 Gwanghwamun Media Façade',        ids:['TuihqC3i9so'] },
    c2021: { t:'Conix · 2021 Jungnangcheon Media Façade',      ids:['PM5W47_SsBk'] },
    c2020: { t:'Conix · 2020 Design Art Fair · Hanwha',        ids:['T--U8d66kik','WrPnNnTwQzQ','cqnSwPXFdDc'] },
    c2019: { t:'Conix · 2019 Carder Garden',                   ids:['8W_nrbswn4k'] }
  };

  // ---------- where each named layer goes ----------
  const ROOMS = ['start','cv','work','contact','prees kit','ai.exe','pig','fishing','daydreaming','idle'];
  const PDF = {
    cony2026: { t:'Cony — Blue 2026',   dir:'pdf/cony2026', n:36, file:'pdf/Cony_blue_2026.pdf' },
    conix:    { t:'Conix',              dir:'pdf/conix',    n:15, file:'pdf/Conix.pdf' },
    casino:   { t:'Casino Cony 2022',   dir:'pdf/casino',   n:23, file:'pdf/Casino_Cony_2022.pdf' },
    reverie:  { t:'Reverie — ISEA2026', dir:'pdf/reverie',  n:8,  file:'pdf/Reverie_ISEA2026.pdf', portrait:true }
  };
  const LINKS = {
    // start
    '->insta':   { url:INSTA, label:'Instagram' },
    '->cony youtube': { url:CHANNEL, label:'YouTube channel' }, '->youtube_2': { url:CHANNEL, label:'YouTube channel' },
    '->work_2':  { room:'work' },    '->Work':    { room:'work' },
    '->contact_2': { room:'contact' }, '->Contact': { room:'contact' },
    'start_cv':  { room:'cv' },      '->CV':      { room:'cv' },
    '->start_2': { world:true, label:'See the whole world' }, '->world': { world:true, label:'See the whole world' },
    'qqfe9 2_2': { room:'prees kit', label:'Press kit' }, '->press kit': { room:'prees kit', label:'Press kit' },
    'start_cony': { game:true, label:'Play East Blue' }, '->mini game': { game:true, label:'Play East Blue' },
    '->conix':   { pdf:'conix' },
    // work list
    '->Pig_2':       { room:'idle' },          // the "→idle" line
    '->Pig':         { room:'pig' },
    '->Fishing':     { room:'fishing' },
    '->daydreaming': { room:'daydreaming' },
    '->Ai.exe':      { room:'ai.exe' },
    '->Conix':       { pdf:'conix' },
    '->Reverie':     { pdf:'reverie' },
    '->54':          { url: OLD + 'timeline.html', label:'54' },
    '->sotrmax youtube': { v:'softmax' }, '->softmax': { v:'softmax' },
    // press kit
    '->daydreaming_4': { pdf:'cony2026' },
    '->daydreaming_2': { pdf:'conix' },
    '->daydreaming_3': { pdf:'casino' },
    '->hum youtube': { v:'hum' }, '->...hum': { v:'hum' },
    // contact
    '->contact':     { url:'mailto:conyww@gmail.com', label:'Email' },
    'rabbit_youtube 3': { url:CHANNEL, label:'YouTube channel' }, '->youtube': { url:CHANNEL, label:'YouTube channel' },
    // works
    '->ai.exe': { v:'aiexe' }, '->ai. exe': { v:'aiexe' },
    '->pig youtube': { v:'pig' }, '->pig youtube_2': { v:'pig' }, '->pig': { v:'pig' },
    'qfee 1': { v:'fishing' }, '->fishing': { v:'fishing' },
    'qegeq 1': { v:'daydreaming' },
    '->idle youtube': { v:'idle' }, '->idle youtube_2': { v:'idle' }, '->idle youtube_3': { v:'idle' },
    '->idle': { v:'idle' }, '->idle_2': { v:'idle' }, 'qqfe12 2': { v:'idle' },
    'dance': { v:'soak' }, '->just stand there': { v:'soak' }
  };
  // same layer name used twice in Figma: decide by the room it sits in
  const IN_ROOM = { daydreaming: { '->daydreaming': { v:'daydreaming' } } };
  const isHome = id => /^->(start|home)(_\d+)?$/.test(id) || /^home0\d(_\d+)?$/.test(id);

  const tag = (el, a, label) => {
    el.dataset.act = JSON.stringify(a);
    el.setAttribute('tabindex', '0');
    el.setAttribute('role', (a.v || a.pdf) ? 'button' : 'link');
    el.setAttribute('aria-label', label || a.label || (a.v ? V[a.v].t : a.pdf ? PDF[a.pdf].t : a.room) || 'Home');
  };
  svg.querySelectorAll('[id]').forEach(el => {
    const id = el.getAttribute('id');
    const room = ROOMS.find(r => el.closest(`g[id="${r}"]`));
    let a = (IN_ROOM[room] || {})[id] || LINKS[id];
    if (!a && id.startsWith('->Fred again')) a = { v:'soak' };
    if (!a && isHome(id)) a = { home:true, label:'Home' };
    if (a) tag(el, a);
  });
  // home buttons sit under big images in a few rooms: bring them to the front so they stay tappable
  svg.querySelectorAll('[data-act]').forEach(el => {
    if (JSON.parse(el.dataset.act).home) el.parentNode.appendChild(el);
  });
  // single lines inside text blocks
  const LINE_LINKS = [
    [/conyww@gmail\.com/, { url:'mailto:conyww@gmail.com', label:'Email' }],
    [/YouTube\s+@conyca/, { url:CHANNEL, label:'YouTube channel' }],
    [/Instagram\s+@conylog/, { url:INSTA, label:'Instagram' }]
  ];
  svg.querySelectorAll('tspan').forEach(t => {
    for (const [re, a] of LINE_LINKS) if (re.test(t.textContent)) { t.dataset.act = JSON.stringify(a); t.setAttribute('role', 'link'); }
  });

  // ---------- room rectangles ----------
  const rooms = {}; window.__rooms = rooms;
  function measureRooms() {
    const inv = svg.getScreenCTM().inverse();
    const wb = el => {                      // element box in world units, transforms included
      const r = el.getBoundingClientRect(); if (!r.width) return null;
      const a = new DOMPoint(r.left, r.top).matrixTransform(inv), z = new DOMPoint(r.right, r.bottom).matrixTransform(inv);
      return { x:a.x, y:a.y, width:z.x - a.x, height:z.y - a.y };
    };
    ROOMS.forEach(id => {
      const g = document.getElementById(id); if (!g) return;
      const clip = g.getAttribute('clip-path');
      if (clip) {
        const r = svg.querySelector(clip.slice(4, -1) + ' rect');
        const m = /translate\(([-\d.]+)[ ,]+([-\d.]+)\)/.exec(r.getAttribute('transform') || '');
        rooms[id] = { x:+m[1], y:+m[2], w:+r.getAttribute('width'), h:+r.getAttribute('height') };
        return;
      }
      let x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity;
      [...g.children].forEach(c => {
        const b = wb(c); if (!b || b.width > 1250) return;   // skip things spilling out on purpose
        x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.width); y1 = Math.max(y1, b.y + b.height);
      });
      const cx = (x0 + x1) / 2, w = Math.max(1080, x1 - x0 + 40);
      rooms[id] = { x: cx - w/2, y: y0 - 110, w, h: Math.max(1920, y1 - y0 + 180) };
      if (id === 'start') { const c = wb(document.getElementById('start_cony')); if (c) rooms[id].anchor = c.x + c.width / 2; }
    });
  }

  // ---------- camera: x,y = world point at the top-left of the screen, s = screen px per unit ----------
  const cam = { x:0, y:0, s:0.1 };
  const vw = () => innerWidth, vh = () => innerHeight;
  const apply = () => svg.setAttribute('viewBox', `${cam.x} ${cam.y} ${vw()/cam.s} ${vh()/cam.s}`);
  const minS = () => Math.min(vw()/W, vh()/H) * 0.6, maxS = 3;
  const clampS = s => Math.max(minS(), Math.min(maxS, s));

  function roomView(id) {
    const r = rooms[id]; const pad = 1.04;
    if (id === 'start' && r.anchor != null) {           // keep CONY in the middle of the screen
      const half = Math.max(r.anchor - r.x, r.x + r.w - r.anchor);
      const s = Math.min(vw() / (2 * half * pad), vh() / 1920);
      const showH = Math.min(r.h, 1920);
      const y = vh()/s > showH ? r.y + showH/2 - vh()/s/2 : r.y;
      return { x: r.anchor - vw()/s/2, y, s };
    }
    const s = Math.min(vw() / (r.w * pad), vh() / 1920);
    const x = r.x + r.w/2 - vw()/s/2;
    const showH = Math.min(r.h, 1920);
    const y = vh()/s > showH ? r.y + showH/2 - vh()/s/2 : r.y;
    return { x, y, s };
  }
  function worldView() {
    const s = Math.min(vw()/W, vh()/H) * 0.96;
    return { s, x: W/2 - vw()/s/2, y: H/2 - vh()/s/2 };
  }

  let raf = 0, here = 'start';
  const eyes = document.getElementById('eyes');
  const setHere = h => { here = h; eyes.setAttribute('aria-label', h === 'start' ? 'See the whole world' : 'Back to start'); };
  function go(t, anim = true) {
    cancelAnimationFrame(raf);
    if (!anim || matchMedia('(prefers-reduced-motion: reduce)').matches) { Object.assign(cam, t); apply(); return; }
    const f = { ...cam }, t0 = performance.now();
    const fc = { x: f.x + vw()/f.s/2, y: f.y + vh()/f.s/2 }, tc = { x: t.x + vw()/t.s/2, y: t.y + vh()/t.s/2 };
    const dist = Math.hypot(tc.x - fc.x, tc.y - fc.y) * Math.min(f.s, t.s);
    const dur = Math.min(1400, 650 + dist * 0.25);
    const ease = k => k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
    const dip = Math.min(0.55, dist / 4000);   // pull back a little on long trips so you see where you're going
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = ease(k);
      const s = Math.exp(Math.log(f.s) + (Math.log(t.s) - Math.log(f.s)) * e - dip * Math.sin(Math.PI * e));
      const cx = fc.x + (tc.x - fc.x) * e, cy = fc.y + (tc.y - fc.y) * e;
      cam.s = s; cam.x = cx - vw()/s/2; cam.y = cy - vh()/s/2; apply();
      if (k < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }
  const toRoom = (id, anim = true) => { if (!rooms[id]) return; setHere(id); go(roomView(id), anim); };
  const toWorld = () => { setHere(null); go(worldView()); };
  const home = () => (here === 'start' ? toWorld() : toRoom('start'));
  eyes.addEventListener('click', home);

  // ---------- video window ----------
  const player = document.getElementById('player'), screen = document.getElementById('screen');
  const ttl = document.getElementById('ttl'), yt = document.getElementById('yt');
  const nav = document.getElementById('nav'), count = document.getElementById('count');
  const prev = document.getElementById('prev'), next = document.getElementById('next');
  let list = null, idx = 0, lastFocus = null, openedAt = 0;
  // one window for both: a YouTube list, or the pages of a PDF
  function show(i) {
    idx = i;
    const many = list.n > 1;
    if (list.pdf) {
      let img = screen.querySelector('img');
      if (!img) { screen.innerHTML = ''; img = document.createElement('img'); img.alt = ''; screen.appendChild(img); }
      img.src = `${list.dir}/${String(i + 1).padStart(2, '0')}.webp`;
      img.alt = `${list.t} — ${i + 1} / ${list.n}`;
      [i + 1, i + 2].forEach(k => { if (k < list.n) new Image().src = `${list.dir}/${String(k + 1).padStart(2, '0')}.webp`; });
      yt.textContent = 'PDF ↓'; yt.href = list.file; yt.setAttribute('download', '');
    } else {
      const id = list.ids[i];
      screen.innerHTML = '';
      const f = document.createElement('iframe');
      f.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=0&modestbranding=1`;
      f.title = list.t; f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen'; f.allowFullscreen = true;
      screen.appendChild(f);
      yt.textContent = 'YouTube ↗'; yt.href = 'https://youtu.be/' + id; yt.removeAttribute('download');
    }
    ttl.textContent = list.t;
    nav.classList.toggle('on', many);
    if (many) { count.textContent = `${i + 1} / ${list.n}`; prev.disabled = i === 0; next.disabled = i === list.n - 1; }
  }
  function openWin(l) {
    list = l;
    lastFocus = document.activeElement;
    player.classList.toggle('pdf', !!l.pdf);
    player.classList.toggle('portrait', !!l.portrait);
    player.classList.add('on'); openedAt = Date.now(); show(0);
    player.querySelector('[data-close]').focus();
  }
  const openVideo = key => V[key] && openWin({ ...V[key], n: V[key].ids.length });
  const openPdf = key => PDF[key] && openWin({ ...PDF[key], pdf: true });
  function closeVideo() {
    if (!player.classList.contains('on')) return false;
    player.classList.remove('on'); screen.innerHTML = ''; list = null;
    lastFocus?.focus?.(); return true;
  }
  player.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) closeVideo();
    else if (e.target === player && Date.now() - openedAt > 500) closeVideo();   // ignore the tap that opened it
  });
  const step = d => { if (list && idx + d >= 0 && idx + d < list.n) show(idx + d); };
  prev.addEventListener('click', () => step(-1));
  next.addEventListener('click', () => step(1));
  // PDF pages: tap the left / right half, or swipe
  let sx = null;
  screen.addEventListener('click', e => { if (!list?.pdf) return; const r = screen.getBoundingClientRect(); step(e.clientX < r.left + r.width / 2 ? -1 : 1); });
  screen.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive:true });
  screen.addEventListener('touchend', e => { if (sx == null || !list?.pdf) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 40) { e.preventDefault(); step(dx < 0 ? 1 : -1); } });
  player.addEventListener('wheel', e => e.stopPropagation(), { passive:true });

  function openUrl(url) {
    if (url.startsWith('mailto:')) { location.href = url; return; }
    const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
  }
  // CONY -> East Blue: everything fades into the plain blue, then the rabbit's world loads
  function enterGame() {
    const f = document.createElement('div');
    f.style.cssText = 'position:fixed;inset:0;z-index:50;background:var(--blue);opacity:0;transition:opacity .5s ease;pointer-events:none';
    document.body.appendChild(f);
    requestAnimationFrame(() => { f.style.opacity = '1'; });
    setTimeout(() => { location.href = 'eastblue/?v=3'; }, 520);
    addEventListener('pageshow', e => { if (e.persisted) f.remove(); }, { once:true });
  }
  function act(a) {
    if (a.url) return;                        // external links open from the click handler (a trusted tap)
    if (a.game) { enterGame(); return; }
    if (a.v) openVideo(a.v);
    else if (a.pdf) openPdf(a.pdf);
    else if (a.room) toRoom(a.room);
    else if (a.world) toWorld();
    else if (a.home) home();
  }

  // ---------- input: drag to move, pinch / ctrl+wheel to zoom, wheel to scroll ----------
  const pts = new Map(); let start = null, moved = 0, pinch = null, lastTap = 0, tapped = null;
  const toWorldPt = (px, py) => ({ x: cam.x + px / cam.s, y: cam.y + py / cam.s });
  function zoomAt(px, py, f) {
    const p = toWorldPt(px, py), s = clampS(cam.s * f);
    cam.s = s; cam.x = p.x - px / s; cam.y = p.y - py / s; apply();
  }
  svg.addEventListener('pointerdown', e => {
    svg.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    cancelAnimationFrame(raf);
    if (pts.size === 1) { start = { x:e.clientX, y:e.clientY, cx:cam.x, cy:cam.y, target:e.target.closest('[data-act]') }; moved = 0; }
    if (pts.size === 2) { const [a,b] = [...pts.values()]; pinch = { d:Math.hypot(a.x-b.x, a.y-b.y), s:cam.s }; start = null; }
  });
  svg.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (pts.size === 2 && pinch) {
      const [a,b] = [...pts.values()];
      zoomAt((a.x+b.x)/2, (a.y+b.y)/2, (pinch.s * Math.hypot(a.x-b.x, a.y-b.y) / pinch.d) / cam.s);
      return;
    }
    if (start) {
      const dx = e.clientX - start.x, dy = e.clientY - start.y;
      moved = Math.max(moved, Math.hypot(dx, dy));
      if (moved > 6) { svg.classList.add('drag'); cam.x = start.cx - dx / cam.s; cam.y = start.cy - dy / cam.s; apply(); }
    }
  });
  const up = e => {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (pts.size === 0) {
      svg.classList.remove('drag');
      if (start && moved <= 6) {
        if (start.target) { tapped = start.target; act(JSON.parse(start.target.dataset.act)); }
        else { const now = Date.now(); if (now - lastTap < 320) toRoom('start'); lastTap = now; }  // double-tap the blue = back to start
      }
      start = null;
    }
  };
  svg.addEventListener('click', () => {
    const el = tapped; if (!el) return;   // pointer capture can retarget click, so use what was tapped
    tapped = null;
    const a = JSON.parse(el.dataset.act); if (a.url) openUrl(a.url);
  });
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive:false }));
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive:false });
  let lastEnd = 0;
  document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastEnd < 300 && !e.target.closest('#player')) e.preventDefault(); lastEnd = n; }, { passive:false });
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  svg.addEventListener('wheel', e => {
    e.preventDefault(); cancelAnimationFrame(raf);
    if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01));
    else { const k = e.deltaMode === 1 ? 32 : 1; cam.x += e.deltaX * k / cam.s; cam.y += e.deltaY * k / cam.s; apply(); }
  }, { passive:false });
  addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (!closeVideo()) toRoom('start'); return; }
    if (player.classList.contains('on')) {
      if (e.key === 'ArrowRight') step(1);
      if (e.key === 'ArrowLeft') step(-1);
      return;
    }
    const a = document.activeElement?.dataset?.act;
    if ((e.key === 'Enter' || e.key === ' ') && a) { e.preventDefault(); const o = JSON.parse(a); o.url ? openUrl(o.url) : act(o); }
  });
  let rz = 0;
  addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => here ? toRoom(here, false) : go(worldView(), false), 120); });


  // ---------- start ----------
  let booted = false;
  function boot() {
    if (booted) return; booted = true;
    Promise.race([window.__langReady, new Promise(r => setTimeout(r, 2500))]).then(() => { measureRooms(); toRoom('start', false); });
  }
  apply();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot); else boot();
  setTimeout(boot, 1500);
})();
</script>


<button id="lang" type="button" aria-label="Switch to English"><span data-l="ko">KR</span> / <span data-l="en">EN</span></button>
<script>
(() => {
  // English for each Korean block, keyed by the start of the Korean text in the Figma export.
  // [korean key, english, corrected korean (optional)]
  const EN = [
    ["왜 토끼와 블루스크린인가", "Why a rabbit, and why a blue screen?"],
    ["이상한 나라의 앨리스와 매트릭스에서도", "In Alice in Wonderland and in The Matrix, the white rabbit leads the way into another world. The blue screen is where a system stops, and where a new world opens."],
    ["Cony (b. 1988) 미디어 아티스트", "Cony (b. 1988)\nMedia artist\n\nEverything begins in a place where there is nothing. Media artist Cony's work starts on an empty blue screen: strange faces, flowers and birds, born the moment AI strays from its intent. Cony catches these 'mistakes' and paints them again."],
    ["2026 ISEA2026 두바이", "2026  ISEA2026 Dubai, Academic Programme — AI.exe: Dante's Fall, Reverie (paper)\n2026  Tomato Ketchup Picnic — art direction & visuals, 24h open-air rave\n2025  SNU Hospital media art proposal — Get Well Soon\n2024  Immersive media art exhibition, Heyri Museum, Paju\n2023  Eterno Cheongdam building projection — Harp Cartoon Show\n2023  Monghwan media art gallery, three-wall media wall, Ansan\n2023  Hyundai Futurenet Heart Avenue proposal — Gaze\n2022  Ayala casino immersive media art, Philippines\n2022  Gwanghwamun Media Art Competition Grand Prize — Xoxo Seoul\n2022  Art Jeju — Goat Song\n2021  Public art Seoul 25 Series, Yangjaecheon, Seocho-gu — No Spoon and more\n2021  Shinsegae Daejeon opening media wall\n2020  Hanwha 70th anniversary TV & print ad — A Sustainable Future\n2020  Design Art Fair, Seoul Arts Center\n2020  Car, the garden, \"I Had a Dream\" music video\n2019  Within the Golden Hour (Cover), Royal Opera House\n2019  Leave Her to Heaven (Cover)"],
    [".exe는 실행 파일을 뜻하지만", ".exe means executable, but an executable cannot run itself. Unless someone clicks, even the most refined algorithm is only dead code.\nThe work follows Dante's Inferno, descending vertically toward the core of the system. It begins in a dark forest, passes through a chaotic city and seasons without music, reaches a landscape where gravity has vanished, and ends on a blue screen. Fatal error. Complete shutdown. What now? The mouse is in your hands.",
      ".exe는 실행 파일을 뜻하지만, 실행 파일은 스스로를 실행할 수 없다. 누군가 클릭하지 않으면 정교한 알고리즘도 죽은 코드일 뿐이다.\n작품은 단테의 『신곡』 지옥편을 따라 시스템의 중심으로 수직 하강한다. 어두운 숲에서 시작해 혼돈의 도시와 음악 없는 계절을 지나, 중력이 사라진 풍경에 닿고 마지막 화면은 블루스크린으로 끝난다. 치명적 오류, 완전한 종료. 이제 어떻게 할 것인가? 마우스는 당신 손에 있다."],
    ["Pig 블루 안에", "Pig\nPortraits, hummingbirds, white freesias and cheesecake float in the blue. They are all things loved by the person I love, images AI made when it strayed from its intent. She was born in the Year of the Pig. The blue screen is where everything ends, but the beginning comes again."],
    ["반지, 뱀, 혀를 내민", "A ring, a snake, a woman with her tongue out, a chain locked link to link. Everything that rises over the blue is both bait and hook. Someone casts a line, and a fish takes the bait. That moment repeats without end, overlapping as it passes.\nFishing or being fished, the two can't be told apart."],
    ["daydreaming 한낮에 꾸는 꿈", "daydreaming\nA dream in broad daylight. The eyes are open, but the mind has wandered a little elsewhere: toward what it wants, pleasant fantasies, scenes that haven't come yet.\nFaces in the blue overlap, turn away, lean on one another. One face blurs into three, and the gaze settles nowhere. Hazy, but it never stops."],
    ["Idle 모두가 같은 자세로", "Idle\nEveryone lies down in the same pose: someone in latex, someone in sunglasses, someone in luxury clothes, a laughing giant, a tiger, even a dog. Lying on the right side, head resting on one hand.\nIn Western painting this pose is the odalisque, a body that receives desire. In the East it is the reclining Buddha, who has let go of all desire. The most desired bodies lie in the least desiring pose.\nThe bodies are still; only the eyes move, slowly. Not asleep, not gone. In machine terms, idle: switched on, running nothing. Just before the blue screen, everything grows this quiet."]
  ];

  const svg = document.getElementById('map');
  const norm = s => s.replace(/[\s\u2028]+/g, ' ').trim();
  const NS = 'http://www.w3.org/2000/svg';
  const blocks = [];
  svg.querySelectorAll('text').forEach(t => {
    const txt = norm(t.textContent);
    const hit = EN.find(([k]) => txt.startsWith(norm(k)));
    if (hit) blocks.push({ t, en: hit[1], ko: hit[2], html: t.innerHTML });
  });

  // measure the Figma layout once, then re-flow the other language into the same box
  function layout(b) {
    if (b.box) return b.box;
    const sp = [...b.t.querySelectorAll('tspan')];
    const ys = sp.map(s => +s.getAttribute('y')), xs = sp.map(s => +s.getAttribute('x'));
    const ws = sp.map(s => s.getComputedTextLength());
    const lh = ys.length > 1 ? Math.min(...ys.slice(1).map((y, i) => y - ys[i]).filter(d => d > 0)) : (+b.t.getAttribute('font-size') || 30) * 1.2;
    const centered = new Set(xs.map(x => Math.round(x))).size > 1;
    const cx = xs.reduce((a, x, i) => a + x + ws[i] / 2, 0) / xs.length;
    return (b.box = { x0: Math.min(...xs), y0: ys[0], lh, width: Math.max(...ws, 200), centered, cx });
  }
  function wrap(b, text) {
    const { x0, y0, lh, width, centered, cx } = layout(b);
    const t = b.t; t.innerHTML = '';
    const probe = document.createElementNS(NS, 'tspan'); t.appendChild(probe);
    const measure = s => { probe.textContent = s; return probe.getComputedTextLength(); };
    const lines = [];
    text.split('\n').forEach(par => {
      if (!par.trim()) { lines.push(''); return; }
      let line = '';
      par.split(' ').forEach(word => {
        const tryL = line ? line + ' ' + word : word;
        if (line && measure(tryL) > width * 1.02) { lines.push(line); line = word; } else line = tryL;
      });
      lines.push(line);
    });
    t.removeChild(probe);
    lines.forEach((l, i) => {
      const s = document.createElementNS(NS, 'tspan');
      s.setAttribute('y', y0 + i * lh);
      if (centered) { s.setAttribute('x', cx); s.setAttribute('text-anchor', 'middle'); } else s.setAttribute('x', x0);
      s.textContent = l || ' ';
      t.appendChild(s);
    });
  }
  let cur = 'ko';
  function apply(lang) {
    blocks.forEach(b => {
      layout(b);
      if (lang === 'en') wrap(b, b.en);
      else if (b.ko) wrap(b, b.ko);
      else b.t.innerHTML = b.html;
    });
    document.documentElement.lang = lang;
    document.querySelectorAll('#lang [data-l]').forEach(s => s.classList.toggle('on', s.dataset.l === lang));
    document.getElementById('lang').setAttribute('aria-label', lang === 'ko' ? 'Switch to English' : '한국어로 보기');
    try { localStorage.setItem('cony-lang3', lang); } catch (e) {}
    cur = lang;
  }
  let saved = null; try { saved = localStorage.getItem('cony-lang3'); } catch (e) {}
  const first = saved || 'ko';                     // Korean first; English is one tap away
  document.getElementById('lang').addEventListener('click', () => apply(cur === 'ko' ? 'en' : 'ko'));
  const ready = document.fonts ? Promise.all([document.fonts.load('300 30px "Noto Sans KR"', '가'), document.fonts.load('300 30px Inter', 'a')]).catch(() => {}) : Promise.resolve();
  window.__langReady = ready.then(() => apply(first));
})();
</script>
