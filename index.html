<text id="Conix is a video technique I developed in 2020. Every frame of a video is repainted with digital brushwork and played back at six frames per second, a speed at which each stroke stays visible while the image still moves. Paired with slow ambient music I compose, it lets time pass a little more slowly for the viewer. Conix works won the Grand Prize of the Gwanghwamun Media Art Competition and were made with Seoul Metropolitan Government, Sejong Center, Shinsegae, Hanwha, KT and MBC." fill="white" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="32" letter-spacing="0em"><tspan x="1369" y="5862.14">Conix is a video technique I developed in 2020. Every frame of </tspan><tspan x="1369" y="5901.14">a video is repainted with digital brushwork and played back at </tspan><tspan x="1369" y="5940.14">six frames per second, a speed at which each stroke stays </tspan><tspan x="1369" y="5979.14">visible while the image still moves. Paired with slow ambient </tspan><tspan x="1369" y="6018.14">music I compose, it lets time pass a little more slowly for the </tspan><tspan x="1369" y="6057.14">viewer. Conix works won the Grand Prize of the </tspan><tspan x="1369" y="6096.14">Gwanghwamun Media Art Competition and were made with </tspan><tspan x="1369" y="6135.14">Seoul Metropolitan Government, Sejong Center, Shinsegae, </tspan><tspan x="1369" y="6174.14">Hanwha, KT and MBC.</tspan></text>

<text id="Pig is the second movement of the AI.exe series. The first, AI.exe: Dante&#x27;s Fall (ISEA 2026 Dubai), traced a vertical descent into a digital inferno ending in a system crash. Pig begins at that very horizon of termination. The work unfolds inside the blue. AI-generated apparitions — classical portraits, hummingbirds, white freesias, slices of cheesecake — drift across the screen. These are products of Reverie, a phenomenon of machine hallucination I identified during my research on LLMs. By curating only the unpredictable glitches from the Grok model — outputs that drifted from the prompt&#x27;s intent — I bridge the gap between mechanical failure and human emotion. We react most profoundly to the moments we cannot predict. The soundtrack, a mid-tempo fusion of future bass and synth-pop, functions as a seamless loop. Heavy sidechain compression creates a visceral pulse, like a heartbeat. Sound and image breathe together in the same blue void. In truth, this is a record of love. The floating icons are things beloved by the person I love. She was born in the Year of the Pig — the final animal of the East Asian zodiac. An animal of abundance, pleasure, fantasy, and mercy. The blue screen is where everything terminates. But it is also where a new cycle begins." fill="white" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="32" letter-spacing="0em"><tspan x="9352" y="5207.14">Pig is the second movement of the AI.exe series. The first, </tspan><tspan x="9352" y="5246.14">AI.exe: Dante&#39;s Fall (ISEA 2026 Dubai), traced a vertical </tspan><tspan x="9352" y="5285.14">descent into a digital inferno ending in a system crash. Pig </tspan><tspan x="9352" y="5324.14">begins at that very horizon of termination.&#10;</tspan><tspan x="9352" y="5363.14">&#10;</tspan><tspan x="9352" y="5402.14">The work unfolds inside the blue. AI-generated apparitions &#x2014; </tspan><tspan x="9352" y="5441.14">classical portraits, hummingbirds, white fre <text id="Idle_Parinirvana is the third movement of the AI.exe series. The first, AI.exe: Dante&#x27;s Fall (ISEA 2026 Dubai), descended into a digital inferno and ended in a system crash. The second, Pig, bloomed from that horizon as a record of love. In the third, everyone lies down. The work unfolds inside the blue. Bodies in latex, sunglasses and luxury fashion, a laughing giant, a tiger, a mastiff all rest in a single shared pose: lying on the right side, head supported by one hand. In Western painting, this is the odalisque, a body arranged to receive the viewer&#x27;s desire. In the East, the same pose is the reclining Buddha on the edge of Parinirvana, the final release from all desire. One posture points to desire and to its end at once. The most desired bodies hold the least desiring posture. The bodies do not move. Only the eyes drift, slowly, from side to side. They are not asleep, and they are not gone. In the exhibition, a central blue image carrying hand-painted icons stands between two wide screens where the figures play simultaneously, stretched in a 32:9 frame like the monumental reclining Buddhas of Southeast Asia. The soundtrack is Claude Debussy&#x27;s Rêverie (1890). It shares its name with Reverie, the phenomenon I identified in my research on LLMs: the moments when a machine drifts from the prompt&#x27;s intent. Slow piano passes over the still bodies, and sound and image dream together in the same blue. In the old Parinirvana paintings, animals gathered around the Buddha to witness his last moment. Here, the witnesses have taken his place. Everyone lies down in the same way, in the same blue, waiting. Idle is what a machine is called when it is switched on but running nothing. The blue screen is where everything terminates. Just before it does, everything is idle." fill="white" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="32" letter-spacing="0em"><tspan x="11463" y="4815.14">&#10;</tspan><tspan x="11463" y="48 <text id="The blue screen is a fatal error. A forced stop. The moment a system can no longer hold itself together. To most people, it means loss — unsaved data, a frozen machine, digital death. But the same blue is also an empty page. A space that owes nothing to what came before it. The end and the beginning sit right next to each other, and the blue screen is exactly that seam. I treat that blue as a place to work. Inside it, I make videos: AI-generated images drifting through the void, paired with music written as loops that never resolve. None of these images have an original. They are copies of things that were never real to begin with — pictures of nothing, pretending to be something. And I paint on it. Not the blue itself — the things that float in front of it. Figures lifted from paintings that were never painted, eyes, birds, flowers, a cake. The screen pretends to be a window into another world. The canvas pretends to be a screen. Two illusions, facing each other, with the same blue between them. One space, approached from two sides." fill="white" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="32" letter-spacing="0em"><tspan x="6840" y="1514.14">The blue screen is a fatal error. A forced stop. The moment a </tspan><tspan x="6840" y="1553.14">system can no longer hold itself together. To most people, it means </tspan><tspan x="6840" y="1592.14">loss &#x2014; unsaved data, a frozen machine, digital death.&#10;</tspan><tspan x="6840" y="1631.14">But the same blue is also an empty page. A space that owes </tspan><tspan x="6840" y="1670.14">nothing to what came before it. The end and the beginning sit right </tspan><tspan x="6840" y="1709.14">next to each other, and the blue screen is exactly that seam.&#10;</tspan><tspan x="6840" y="1748.14">I treat that blue as a place to work. Inside it, I make videos: AI-</tspan><tspan x="6840" y="1787.14">generated images drifting through the void, paired with music </tspan><tspan x="6840" y="1826.14">written as loops that never resolve. None of these images have an </tspan><tspan x="6840" y="1865.14">original. They are copies of things that were never real to begin with </tspan><tspan x="6840" y="1904.14">&#x2014; pictures of nothing, pretending to be something.&#10;</tspan><tspan x="6840" y="1943.14">And I paint on it. Not the blue itself &#x2014; the things that float in front of </tspan><tspan x="6840" y="1982.14">it. Figures lifted from paintings that were never painted, eyes, birds, </tspan><tspan x="6840" y="2021.14">flowers, a cake. The screen pretends to be a window into another </tspan><tspan x="6840" y="2060.14">world. The canvas pretends to be a screen. Two illusions, facing </tspan><tspan x="6840" y="2099.14">each other, with the same blue between them. One space, </tspan><tspan x="6840" y="2138.14">approached from two sides.</tspan></text>

<script>
(() => {
  const svg = document.getElementById('map');
  const [ , , W, H] = svg.getAttribute('viewBox').split(' ').map(Number);   // world size in design units
  const OLD = 'https://6fpqxhvkv9-sudo.github.io/follow-the-white-rabbit/';
  const CHANNEL = 'https://www.youtube.com/@conyca';
  const INSTA = 'https://www.instagram.com/conylog/';

  // ---------- videos (from the "youtube link" boards in Figma) ----------
  const V = {
    hum:         { t:'...hum',                                   ids:['yCPTT2HWdvk'] },
    pig:         { t:'Pig',                                      ids:['IrTLmfbwePg'] },
    idle:        { t:'Idle_Parinirvana',                         ids:['blA9iTVe8TI'] },
    soak:        { t:'Fred again.. & SOAK — just stand there',   ids:['IOCjpTBeIjA'] },
    softmax:     { t:'softmax',                                  ids:['iNObYr0SnUw'] },
    aiexe:       { t:"AI.exe: Dante's Fall",                     ids:['sqpTtHn77H0'] },
    daydreaming: { t:'Daydreaming',                              ids:['w6UZ7NvDK2I'] },
    fishing:     { t:'Fishing',                                  ids:['yxRHQTA8Gwg'] },
    c2024: { t:'Conix · 2024 Immersive Media Art Exhibition', ids:['6OpkB-lz9hk','nzmCq_-Nxlk','kCH97zbiE1c','S-TfLBCw6uo'] },
    c2023: { t:'Conix · 2023 Eterno Cheongdam',                ids:['isNzzi5xa_I'] },
    c2022: { t:'Conix · 2022 Gwanghwamun Media Façade',        ids:['TuihqC3i9so'] },
    c2021: { t:'Conix · 2021 Jungnangcheon Media Façade',      ids:['PM5W47_SsBk'] },
    c2020: { t:'Conix · 2020 Design Art Fair · Hanwha',        ids:['T--U8d66kik','WrPnNnTwQzQ','cqnSwPXFdDc'] },
    c2019: { t:'Conix · 2019 Carder Garden',                   ids:['8W_nrbswn4k'] }
  };

  // ---------- where each named layer goes ----------
  const ROOMS = ['start','cv','work','contact','Ai.exe','pig','idle','conix','Fishing','Daydreaming'];
  const LINKS = {
    // start
    '->insta':   { url:INSTA, label:'Instagram' },
    '->cony youtube': { url:CHANNEL, label:'YouTube channel' }, '->youtube': { url:CHANNEL, label:'YouTube channel' },
    '->work':    { room:'work' },    '->Work':    { room:'work' },
    '->contact': { room:'contact' }, '->Contact': { room:'contact' },
    'start_cv':  { room:'cv' },      '->CV':      { room:'cv' },
    '->conix':   { room:'conix' },
    // work list
    'work->idle':    { room:'idle' },
    '->Pig':         { room:'pig' },
    '->Fishing':     { room:'Fishing' },
    '->daydreaming': { room:'Daydreaming' },
    '->Ai.exe':      { room:'Ai.exe' },
    '->Conix':       { room:'conix' },
    '->Reverie':     { url: OLD + 'Reverie.pdf', label:'Reverie (PDF)' },
    '->54':          { url: OLD + 'timeline.html', label:'54' },
    // contact
    '->contact_2':   { url:'mailto:conyww@gmail.com', label:'Email' },
    // videos
    '->hum youtube': { v:'hum' }, '->...hum': { v:'hum' },
    '->pig youtube': { v:'pig' }, '->pig youtube_2': { v:'pig' }, '-> pig youtube': { v:'pig' },
    '->pig': { v:'pig' }, '->pig_2': { v:'pig' }, '->pig_3': { v:'pig' },
    '->idle youtube': { v:'idle' }, '->idle youtube_2': { v:'idle' }, '->idle youtube_3': { v:'idle' },
    '->idle': { v:'idle' }, '->idle_3': { v:'idle' },
    '-> soak youtube': { v:'soak' },
    '->softmax youtube': { v:'softmax' }, '->sotrmax youtube': { v:'softmax' }, '->softmax': { v:'softmax' }, '->softmax_3': { v:'softmax' },
    '->ai.exe youtube': { v:'aiexe' }, '->ai.exe youtube_2': { v:'aiexe' }, '->ai.exe_2': { v:'aiexe' },
    'ai.exe 1': { v:'aiexe' }, '->ai. exe': { v:'aiexe' },
    'Daydreaming_2': { v:'daydreaming' }, 'Loading..._2': { v:'daydreaming' },
    'Fishing_2': { v:'fishing' }, 'Loading...': { v:'fishing' }
  };
  const isHome = id => /^->(start|home)(_\d+)?$/.test(id) || /^home0\d(_\d+)?$/.test(id);

  const tag = (el, a, label) => {
    el.dataset.act = JSON.stringify(a);
    el.setAttribute('tabindex', '0');
    el.setAttribute('role', a.v ? 'button' : 'link');
    el.setAttribute('aria-label', label || a.label || (a.v ? V[a.v].t : a.room) || 'Home');
  };
  svg.querySelectorAll('[id]').forEach(el => {
    const id = el.getAttribute('id');
    let a = LINKS[id];
    if (!a && id.startsWith('->Fred again')) a = { v:'soak' };
    if (!a && isHome(id)) a = { home:true, label:'Home' };
    if (a) tag(el, a);
  });
  // Conix room: each year opens that year's videos
  document.querySelectorAll('#conix text').forEach(t => {
    const y = /^\s*(20(19|2[0-4]))/.exec(t.textContent);
    if (y && V['c' + y[1]]) tag(t, { v:'c' + y[1] });
  });
  // single lines inside text blocks
  const LINE_LINKS = [
    [/conyww@gmail\.com/, { url:'mailto:conyww@gmail.com', label:'Email' }],
    [/YouTube\s+@conyca/, { url:CHANNEL, label:'YouTube channel' }],
    [/Instagram\s+@conylog/, { url:INSTA, label:'Instagram' }]
  ];
  svg.querySelectorAll('tspan').forEach(t => {
    for (const [re, a] of LINE_LINKS) if (re.test(t.textContent)) { t.dataset.act = JSON.stringify(a); t.setAttribute('role', 'link'); }
  });

  // ---------- room rectangles ----------
  const rooms = {}; window.__rooms = rooms;
  function measureRooms() {
    const inv = svg.getScreenCTM().inverse();
    const wb = el => {                      // element box in world units, transforms included
      const r = el.getBoundingClientRect(); if (!r.width) return null;
      const a = new DOMPoint(r.left, r.top).matrixTransform(inv), z = new DOMPoint(r.right, r.bottom).matrixTransform(inv);
      return { x:a.x, y:a.y, width:z.x - a.x, height:z.y - a.y };
    };
    ROOMS.forEach(id => {
      const g = document.getElementById(id); if (!g) return;
      const clip = g.getAttribute('clip-path');
      if (clip) {
        const r = svg.querySelector(clip.slice(4, -1) + ' rect');
        const m = /translate\(([-\d.]+)[ ,]+([-\d.]+)\)/.exec(r.getAttribute('transform') || '');
        rooms[id] = { x:+m[1], y:+m[2], w:+r.getAttribute('width'), h:+r.getAttribute('height') };
        return;
      }
      let x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity;
      [...g.children].forEach(c => {
        const b = wb(c); if (!b || b.width > 1250) return;   // skip things spilling out on purpose
        x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.width); y1 = Math.max(y1, b.y + b.height);
      });
      const cx = (x0 + x1) / 2, w = Math.max(1080, x1 - x0 + 40);
      rooms[id] = { x: cx - w/2, y: y0 - 110, w, h: Math.max(1920, y1 - y0 + 180) };
    });
  }

  // ---------- camera: x,y = world point at the top-left of the screen, s = screen px per unit ----------
  const cam = { x:0, y:0, s:0.1 };
  const vw = () => innerWidth, vh = () => innerHeight;
  const apply = () => svg.setAttribute('viewBox', `${cam.x} ${cam.y} ${vw()/cam.s} ${vh()/cam.s}`);
  const minS = () => Math.min(vw()/W, vh()/H) * 0.6, maxS = 3;
  const clampS = s => Math.max(minS(), Math.min(maxS, s));

  function roomView(id) {
    const r = rooms[id]; const pad = 1.04;
    const s = Math.min(vw() / (r.w * pad), vh() / 1920);
    const x = r.x + r.w/2 - vw()/s/2;
    const showH = Math.min(r.h, 1920);
    const y = vh()/s > showH ? r.y + showH/2 - vh()/s/2 : r.y;
    return { x, y, s };
  }
  function worldView() {
    const s = Math.min(vw()/W, vh()/H) * 0.96;
    return { s, x: W/2 - vw()/s/2, y: H/2 - vh()/s/2 };
  }

  let raf = 0, here = 'start';
  const eyes = document.getElementById('eyes');
  const setHere = h => { here = h; eyes.setAttribute('aria-label', h === 'start' ? 'See the whole world' : 'Back to start'); };
  function go(t, anim = true) {
    cancelAnimationFrame(raf);
    if (!anim || matchMedia('(prefers-reduced-motion: reduce)').matches) { Object.assign(cam, t); apply(); return; }
    const f = { ...cam }, t0 = performance.now();
    const fc = { x: f.x + vw()/f.s/2, y: f.y + vh()/f.s/2 }, tc = { x: t.x + vw()/t.s/2, y: t.y + vh()/t.s/2 };
    const dist = Math.hypot(tc.x - fc.x, tc.y - fc.y) * Math.min(f.s, t.s);
    const dur = Math.min(1400, 650 + dist * 0.25);
    const ease = k => k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
    const dip = Math.min(0.55, dist / 4000);   // pull back a little on long trips so you see where you're going
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = ease(k);
      const s = Math.exp(Math.log(f.s) + (Math.log(t.s) - Math.log(f.s)) * e - dip * Math.sin(Math.PI * e));
      const cx = fc.x + (tc.x - fc.x) * e, cy = fc.y + (tc.y - fc.y) * e;
      cam.s = s; cam.x = cx - vw()/s/2; cam.y = cy - vh()/s/2; apply();
      if (k < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }
  const toRoom = (id, anim = true) => { if (!rooms[id]) return; setHere(id); go(roomView(id), anim); };
  const toWorld = () => { setHere(null); go(worldView()); };
  const home = () => (here === 'start' ? toWorld() : toRoom('start'));
  eyes.addEventListener('click', home);

  // ---------- video window ----------
  const player = document.getElementById('player'), screen = document.getElementById('screen');
  const ttl = document.getElementById('ttl'), yt = document.getElementById('yt');
  const nav = document.getElementById('nav'), count = document.getElementById('count');
  const prev = document.getElementById('prev'), next = document.getElementById('next');
  let list = null, idx = 0, lastFocus = null, openedAt = 0;
  function show(i) {
    idx = i; const id = list.ids[i];
    screen.innerHTML = '';
    const f = document.createElement('iframe');
    f.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=0&modestbranding=1`;
    f.title = list.t; f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen'; f.allowFullscreen = true;
    screen.appendChild(f);
    ttl.textContent = list.t; yt.href = 'https://youtu.be/' + id;
    const many = list.ids.length > 1;
    nav.classList.toggle('on', many);
    if (many) { count.textContent = `${i + 1} / ${list.ids.length}`; prev.disabled = i === 0; next.disabled = i === list.ids.length - 1; }
  }
  function openVideo(key) {
    list = V[key]; if (!list) return;
    lastFocus = document.activeElement;
    player.classList.add('on'); openedAt = Date.now(); show(0);
    player.querySelector('[data-close]').focus();
  }
  function closeVideo() {
    if (!player.classList.contains('on')) return false;
    player.classList.remove('on'); screen.innerHTML = ''; list = null;
    lastFocus?.focus?.(); return true;
  }
  player.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) closeVideo();
    else if (e.target === player && Date.now() - openedAt > 500) closeVideo();   // ignore the tap that opened it
  });
  prev.addEventListener('click', () => idx > 0 && show(idx - 1));
  next.addEventListener('click', () => list && idx < list.ids.length - 1 && show(idx + 1));
  player.addEventListener('wheel', e => e.stopPropagation(), { passive:true });

  function openUrl(url) {
    if (url.startsWith('mailto:')) { location.href = url; return; }
    const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
  }
  function act(a) {
    if (a.url) return;                        // external links open from the click handler (a trusted tap)
    if (a.v) openVideo(a.v);
    else if (a.room) toRoom(a.room);
    else if (a.home) home();
  }

  // ---------- input: drag to move, pinch / ctrl+wheel to zoom, wheel to scroll ----------
  const pts = new Map(); let start = null, moved = 0, pinch = null, lastTap = 0, tapped = null;
  const toWorldPt = (px, py) => ({ x: cam.x + px / cam.s, y: cam.y + py / cam.s });
  function zoomAt(px, py, f) {
    const p = toWorldPt(px, py), s = clampS(cam.s * f);
    cam.s = s; cam.x = p.x - px / s; cam.y = p.y - py / s; apply();
  }
  svg.addEventListener('pointerdown', e => {
    svg.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    cancelAnimationFrame(raf);
    if (pts.size === 1) { start = { x:e.clientX, y:e.clientY, cx:cam.x, cy:cam.y, target:e.target.closest('[data-act]') }; moved = 0; }
    if (pts.size === 2) { const [a,b] = [...pts.values()]; pinch = { d:Math.hypot(a.x-b.x, a.y-b.y), s:cam.s }; start = null; }
  });
  svg.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (pts.size === 2 && pinch) {
      const [a,b] = [...pts.values()];
      zoomAt((a.x+b.x)/2, (a.y+b.y)/2, (pinch.s * Math.hypot(a.x-b.x, a.y-b.y) / pinch.d) / cam.s);
      return;
    }
    if (start) {
      const dx = e.clientX - start.x, dy = e.clientY - start.y;
      moved = Math.max(moved, Math.hypot(dx, dy));
      if (moved > 6) { svg.classList.add('drag'); cam.x = start.cx - dx / cam.s; cam.y = start.cy - dy / cam.s; apply(); }
    }
  });
  const up = e => {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (pts.size === 0) {
      svg.classList.remove('drag');
      if (start && moved <= 6) {
        if (start.target) { tapped = start.target; act(JSON.parse(start.target.dataset.act)); }
        else { const now = Date.now(); if (now - lastTap < 320) toRoom('start'); lastTap = now; }  // double-tap the blue = back to start
      }
      start = null;
    }
  };
  svg.addEventListener('click', () => {
    const el = tapped; if (!el) return;   // pointer capture can retarget click, so use what was tapped
    tapped = null;
    const a = JSON.parse(el.dataset.act); if (a.url) openUrl(a.url);
  });
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  svg.addEventListener('wheel', e => {
    e.preventDefault(); cancelAnimationFrame(raf);
    if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01));
    else { const k = e.deltaMode === 1 ? 32 : 1; cam.x += e.deltaX * k / cam.s; cam.y += e.deltaY * k / cam.s; apply(); }
  }, { passive:false });
  addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (!closeVideo()) toRoom('start'); return; }
    if (player.classList.contains('on')) {
      if (e.key === 'ArrowRight' && list && idx < list.ids.length - 1) show(idx + 1);
      if (e.key === 'ArrowLeft' && idx > 0) show(idx - 1);
      return;
    }
    const a = document.activeElement?.dataset?.act;
    if ((e.key === 'Enter' || e.key === ' ') && a) { e.preventDefault(); const o = JSON.parse(a); o.url ? openUrl(o.url) : act(o); }
  });
  let rz = 0;
  addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => here ? toRoom(here, false) : go(worldView(), false), 120); });


  // ---------- start ----------
  let booted = false;
  function boot() {
    if (booted) return; booted = true; measureRooms(); toRoom('start', false);
  }
  apply();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot); else boot();
  setTimeout(boot, 1500);
})();
</script>

    ["2022 Gwanghwamun Media Façade Competition — Grand", "2022 광화문 미디어파사드 공모전\n— 대상, 세종문화회관"],

    ["2019 Carder Garden — music", "2019 카더가든\n— 뮤직비디오"],

    // ---------- pig ----------
    ["In Pig, love blooms from that same blue void", "Pig에서 사랑은 같은 파란 허공에서 피어난다. AI가 만든 인물들, 한 번도 그려진 적 없는 그림들, 새와 꽃. 무엇에도 원본은 없다. 그런데도 따뜻하다. 음악도 반복되고, 영상도 반복된다. 파랑에는 끝이 없다. 사랑도 그렇다."],
    ["Pig is the second movement of the AI.exe series", "Pig는 AI.exe 시리즈의 두 번째 악장이다. 첫 번째 악장 《AI.exe: 단테의 추락》(ISEA 2026 두바이)은 디지털 지옥으로 수직 하강해 시스템 크래시로 끝났다. Pig는 바로 그 종말의 지평선에서 시작한다.\n\n작품은 블루 안에서 펼쳐진다. 고전적인 초상, 벌새, 하얀 프리지아, 치즈케이크 조각. AI가 만든 환영들이 화면을 떠다닌다. 이것들은 내가 LLM 연구에서 발견한 기계의 환각 현상, Reverie의 산물이다. 나는 Grok 모델이 프롬프트의 의도에서 벗어난 순간, 예측할 수 없는 글리치만을 골라 기계의 실패와 인간의 감정 사이를 잇는다. 우리는 예측할 수 없는 순간에 가장 깊이 반응한다.\n\n사운드트랙은 퓨처 베이스와 신스팝이 섞인 미드템포 곡으로, 이음새 없는 루프로 흐른다. 강한 사이드체인 컴프레션이 심장 박동 같은 맥박을 만든다. 소리와 이미지는 같은 파란 허공 속에서 함께 숨 쉰다.\n\n사실 이것은 사랑의 기록이다. 떠다니는 아이콘들은 내가 사랑하는 사람이 사랑하는 것들이다. 그녀는 돼지띠다. 십이지의 마지막 동물. 풍요와 쾌락, 환상과 자비의 동물.\n\n블루스크린은 모든 것이 끝나는 곳이다. 그러나 새로운 순환이 시작되는 곳이기도 하다."],

    // ---------- idle ----------
    ["Idle_Parinirvana is the third movement", "\n\nIdle_Parinirvana는 AI.exe 시리즈의 세 번째 악장이다. 첫 번째 악장 《AI.exe: 단테의 추락》(ISEA 2026 두바이)은 디지털 지옥으로 수직 하강해 시스템 크래시로 끝났다. 두 번째 악장 《Pig》는 그 종말의 지평선에서 사랑의 기록으로 피어났다. 세 번째 악장에서는 모두가 눕는다.\n\n작품은 블루 안에서 펼쳐진다. 라텍스와 선글라스, 명품을 걸친 몸들, 웃는 거구의 남자, 호랑이, 마스티프. 온갖 존재들이 하나의 자세로 쉬고 있다. 오른쪽으로 누워 한 손으로 머리를 받친 자세. 서양 회화에서 이 자세는 오달리스크, 보는 이의 욕망을 받아내는 몸이다. 동양에서 같은 자세는 열반에 들기 직전의 와불, 모든 욕망으로부터의 마지막 해방이다. 하나의 자세가 욕망과 그 끝을 동시에 가리킨다. 가장 욕망스러운 몸들이 가장 욕망 없는 자세를 하고 있다.\n\n몸은 움직이지 않는다. 눈만 천천히 좌우로 떠돈다. 잠든 것도, 떠난 것도 아니다. 전시에서는 손그림 아이콘이 담긴 블루 이미지가 가운데 서고, 양옆의 넓은 화면에서 인물들이 동시에 재생된다. 32:9로 길게 늘어난 화면은 동남아시아의 거대한 와불처럼 공간을 채운다.\n\n사운드트랙은 클로드 드뷔시의 〈Rêverie(몽상)〉(1890)다. 기계가 프롬프트의 의도에서 벗어나는 순간, 내가 LLM 연구에서 Reverie라고 이름 붙인 현상과 같은 이름이다. 느린 피아노가 멈춘 몸들 위로 흐르고, 소리와 이미지는 같은 블루 안에서 함께 꿈꾼다.\n\n옛 열반도에서 동물들은 부처의 마지막을 지켜보려 모여들었다. 여기서는 그 구경꾼들이 부처의 자리에 누웠다. 모두가 같은 방식으로, 같은 블루 안에서, 기다린다.\n\nIdle은 켜져 있지만 아무것도 실행하지 않는 기계의 상태를 부르는 말이다. 블루스크린은 모든 것이 종료되는 곳이다. 그 직전, 모든 것은 idle 상태다."],

    // ---------- cv ----------
    ["Cony (Lee Geonhee, b. 1988) is a media artist", "코니(이건희, 1988년생)는 한국에서 활동하는 미디어 아티스트, 작곡가, AI 리서처다. 회화를 전공했고, AI 생성 이미지와 손으로 그린 회화, 직접 만든 음악을 멈춰버린 컴퓨터의 블루스크린 안에서 끝없이 반복되는 영상으로 엮는다."],
    ["Cony, b. 1988 Media artist", "코니, 1988년생\n미디어 아티스트 / 작곡가 / AI 리서처\n학력 중앙대학교 서양화과 졸업\n\n2026 ISEA2026 두바이, 학술 프로그램\n— 《AI.exe: 단테의 추락》\n— 「Reverie」 (연구 논문)\n\n토마토 케첩 피크닉\n— 아트 디렉션 & 비주얼, 24시간 야외 레이브\n\n2024 이머시브 미디어아트 전시\n— 파주 헤이리\n\n2023 에테르노 청담\n— 옥외 사이니지\n\n2022 광화문 미디어파사드 공모전\n— 대상, 세종문화회관\n\n2021 중랑천 미디어파사드\n— 25편 시리즈, 서울시\n\n신세계백화점 대전점\n— 디스플레이 설치\n\n2020 디자인아트페어, 예술의전당 · 한화 창립 70주년\n— TV·신문 광고\n\n2019 카더가든\n— 뮤직비디오"],

    // ---------- work ----------
    ["The blue screen is a fatal error", "블루스크린은 치명적 오류다. 강제 정지. 시스템이 더 이상 자기 자신을 지탱할 수 없는 순간. 대부분의 사람들에게 그것은 상실을 뜻한다. 저장되지 않은 데이터, 멈춰버린 기계, 디지털 죽음.\n그러나 같은 파란색은 동시에 빈 페이지다. 그 이전에 있던 것에 아무것도 빚지지 않는 공간. 끝과 시작이 바로 옆에 나란히 놓여 있고, 블루스크린은 정확히 그 이음매다.\n나는 그 파란색을 작업하는 자리로 삼는다. 그 안에서 영상을 만든다. AI가 생성한 이미지들이 공허를 떠다니고, 해소되지 않는 루프로 쓰인 음악과 함께 흐른다. 이 이미지들 중 어느 것도 원본이 없다. 애초에 진짜였던 적 없는 것들의 복제, 아무것도 아닌 것의 그림이 무언가인 척하는 것이다.\n그리고 나는 그 위에 그린다. 파란색 자체가 아니라 그 앞에 떠 있는 것들을. 한 번도 그려진 적 없는 그림에서 떼어낸 인물들, 눈, 새, 꽃, 케이크. 화면은 다른 세계로 향하는 창문인 척한다. 캔버스는 화면인 척한다. 같은 파란색을 사이에 두고 마주 보는 두 개의 환상. 양쪽에서 다가가는 하나의 공간."],

    // ---------- Ai.exe ----------
    ["ISEA 2026 Dubai Direction", "ISEA 2026 두바이\n연출, 영상, 음악, AI 큐레이션 — 코니\n소프트웨어: Logic Pro, Final Cut Pro, Grok"],
    ["The title states a technical fact", "제목은 기술적 사실을 말한다. 확장자 '.exe'는 실행 파일을 뜻한다. 그러나 실행 파일은 스스로 실행될 수 없다. 알고리즘이 아무리 정교해도 인간이 더블클릭하지 않으면 디지털 공간을 떠도는 죽은 코드일 뿐이다. AI 시대의 본질은 기술이 아니라 그것을 실행하는 인간의 의지에 있다.\n작품은 단테의 《신곡》 지옥편의 구조를 따라 시스템의 중심을 향해 수직으로 내려간다. 시작은 어두운 숲이다. 얼굴들이 나타났다 사라지고, 새들이 맴돈다. 방향을 잃은 주체.\n이어지는 장면들은 현대 시스템의 혼돈을 조각조각 드러낸다. 빠르게 지나가는 자동차, 연기를 내뿜는 공장, 속삭이는 인물들, 슬픔과 무관심의 표정이 잇따라 스친다. 그다음 영상은 음악 없이 계절을 통과한다. AI가 만든 인물들이 저마다의 이야기 속에 머무는 동안 현장음만 남는다.\n그리고 시스템의 중력이 사라진 비현실의 풍경에 닿는다. 구름 위를 걷는 군중, 하늘로 오르는 장면들. 시스템의 감시를 상징하는 두 남자의 시선 끝에서 화면은 파랗게 변한다. 컴퓨터에서 파랑은 치명적 오류, 완전한 종료를 뜻한다. 그러나 루프가 다시 시작되기 직전, 두 남자는 차가운 표정을 버리고 아이처럼 웃으며 논다. 시스템은 죽었다. 그들은 아니다.\n실패의 화면은 실행자의 의지로 놀이의 공간이 된다. AI.exe는 멈췄다. 당신은 무엇을 출력할 것인가? 이제 마우스는 당신 손에 있다."],
    ["AI.exe: Dante's Fall, Single-channel Video Still, 04", "《AI.exe: 단테의 추락》 싱글채널 영상 스틸, 04'10'' — 두 실행자: 시스템에 맞서는 전복적 웃음. AI 생성, 겹겹의 감각 합성."],
    ["AI.exe: Dante's Fall, Single-channel Video Still, 00", "《AI.exe: 단테의 추락》 싱글채널 영상 스틸, 00'00'' — '어두운 숲(Selva Oscura)', 시작. AI 생성, 겹겹의 감각 합성."],
    ["AI.exe: Dante's Fall, Installation View Draft", "《AI.exe: 단테의 추락》 설치 전경 초안. 가운데 '실행자의 오아시스'(대형 빈백)가 놓인 몰입형 다크 박스."],

    // ---------- small bits ----------
    ["Loading...", "준비 중...", 'lines'],
    ["exhibitions · commissions · press", "전시 · 커미션 · 프레스", 'first']
  ];

  const svg = document.getElementById('map');
  const norm = s => s.replace(/\s+/g, ' ').trim();
  const NS = 'http://www.w3.org/2000/svg';
  const blocks = [];
  svg.querySelectorAll('text').forEach(t => {
    const en = norm(t.textContent);
    const hit = KO.find(([k]) => en.startsWith(norm(k)));
    if (hit) blocks.push({ t, ko: hit[1], mode: hit[2] || 'wrap', html: t.innerHTML });
  });

  // measure the English layout once, then re-flow Korean into the same box
  function layout(b) {
    if (b.box) return b.box;
    const sp = [...b.t.querySelectorAll('tspan')];
    const ys = sp.map(s => +s.getAttribute('y')), xs = sp.map(s => +s.getAttribute('x'));
    const ws = sp.map(s => s.getComputedTextLength());
    const lh = ys.length > 1 ? Math.min(...ys.slice(1).map((y, i) => y - ys[i]).filter(d => d > 0)) : (+b.t.getAttribute('font-size') || 32) * 1.22;
    const centered = new Set(xs.map(x => Math.round(x))).size > 1;
    const cx = xs.reduce((a, x, i) => a + x + ws[i] / 2, 0) / xs.length;
    return (b.box = { x0: Math.min(...xs), y0: ys[0], lh, width: Math.max(...ws, 200), centered, cx });
  }
  function wrapKo(b) {
    const { x0, y0, lh, width, centered, cx } = layout(b);
    const t = b.t; t.innerHTML = '';
    t.style.fontFamily = "'Noto Sans KR', 'Inter', sans-serif";
    const probe = document.createElementNS(NS, 'tspan'); t.appendChild(probe);
    const measure = s => { probe.textContent = s; return probe.getComputedTextLength(); };
    const lines = [];
    b.ko.split('\n').forEach(par => {
      if (!par.trim()) { lines.push(''); return; }
      let line = '';
      par.split(' ').forEach(word => {
        const tryL = line ? line + ' ' + word : word;
        if (line && measure(tryL) > width * 1.02) { lines.push(line); line = word; } else line = tryL;
      });
      lines.push(line);
    });
    t.removeChild(probe);
    lines.forEach((l, i) => {
      const s = document.createElementNS(NS, 'tspan');
      s.setAttribute('y', y0 + i * lh);
      if (centered) { s.setAttribute('x', cx); s.setAttribute('text-anchor', 'middle'); } else s.setAttribute('x', x0);
      s.textContent = l || ' ';
      t.appendChild(s);
    });
  }
  function apply(lang) {
    blocks.forEach(b => {
      if (lang === 'ko') {
        layout(b);
        if (b.mode === 'wrap') wrapKo(b);
        else {
          const sp = b.t.querySelectorAll('tspan');
          if (b.mode === 'lines') sp.forEach((s, i) => s.textContent = b.ko.split('\n')[i] ?? '');
          else sp[0].textContent = b.ko;
          b.t.style.fontFamily = "'Noto Sans KR', 'Inter', sans-serif";
        }
      } else { b.t.innerHTML = b.html; b.t.style.fontFamily = ''; }
    });
    document.documentElement.lang = lang;
    document.querySelectorAll('#lang [data-l]').forEach(s => s.classList.toggle('on', s.dataset.l === lang));
    document.getElementById('lang').setAttribute('aria-label', lang === 'ko' ? 'Switch to English' : '한국어로 보기');
    try { localStorage.setItem('cony-lang', lang); } catch (e) {}
    cur = lang;
  }
  let cur = 'en';
  let saved = null; try { saved = localStorage.getItem('cony-lang'); } catch (e) {}
  const first = saved || ((navigator.language || '').toLowerCase().startsWith('ko') ? 'ko' : 'en');
  document.getElementById('lang').addEventListener('click', () => apply(cur === 'ko' ? 'en' : 'ko'));
  // wait for both fonts before measuring
  const ready = document.fonts ? Promise.all([document.fonts.load('32px "Noto Sans KR"', '가'), document.fonts.load('32px Inter', 'a')]).catch(() => {}) : Promise.resolve();
  ready.then(() => apply(first));
})();
</script>
